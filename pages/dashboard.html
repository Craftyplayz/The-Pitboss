<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Pitboss</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/static/pitboss-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1319;--side:#0a0e13;--card:#161c25;--line:#232c39;--tx:#dce3ec;--mu:#8190a3;--gold:#F0C35A;--win:#4fc98a;--loss:#e5636d;--r:12px}
*{box-sizing:border-box;margin:0}
html,body{overflow-x:hidden}
body{background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,sans-serif;min-height:100vh}
a{color:var(--gold)}
#side{position:fixed;inset:0 auto 0 0;width:232px;background:var(--side);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:6px;z-index:20;transition:transform .2s}
.logo{font:700 19px Cinzel,serif;color:var(--gold);letter-spacing:.06em;padding:0 10px 22px}

.nav{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--mu);font:500 14px Inter;padding:10px;border-radius:8px;cursor:pointer;text-align:left;width:100%;margin-bottom:2px}
.nav:hover{background:#121922;color:var(--tx)}
.nav.on{background:#1c2430;color:var(--gold)}
.nav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.srv{margin-top:auto;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:12px;color:var(--mu)}
.srv b{display:block;color:var(--tx);font-size:13px}
#top{display:none;position:sticky;top:0;z-index:15;background:var(--side);border-bottom:1px solid var(--line);padding:10px 16px;align-items:center;gap:12px}
#top button{background:none;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:6px 10px;font-size:18px;cursor:pointer}
main{margin-left:232px;height:100vh;overflow:hidden}
h1{font:600 22px Inter}
h2{font:600 14px Inter;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
h2 small{color:var(--mu);font-weight:400;font-size:12px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(12,minmax(0,1fr));margin-bottom:16px;align-items:stretch}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;display:flex;flex-direction:column}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.kpi .l{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.kpi .v{font:600 26px Inter;margin:6px 0 2px;display:flex;align-items:center;gap:10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.kpi .d{font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up{color:var(--win)}.dn{color:var(--loss)}.gold{color:var(--gold)}.mu{color:var(--mu)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mu);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.07em;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th.cur{color:var(--gold)}td.cur{background:#f0c35a0d}
td{padding:9px 10px;border-bottom:1px solid #1d2531;text-align:right;white-space:nowrap}
th:first-child,td:first-child,th.l,td.l{text-align:left}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#1a222d}
tr.click{cursor:pointer}
[data-h],[data-i]{cursor:pointer}
#itd{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:18px;width:min(380px,calc(100vw - 32px));margin:auto}
#itd::backdrop{background:#000a}
#itd p{white-space:pre-line;margin:12px 0;font-size:13px;line-height:1.45}
.who{display:flex;align-items:center;gap:10px}
.av{width:30px;height:30px;border-radius:50%;object-fit:cover;background:#222;flex:none}
.av.ph{display:inline-flex;align-items:center;justify-content:center;font:600 12px Inter;color:var(--mu);background:#222c3a}
.hi{width:30px;height:30px;border-radius:8px;object-fit:cover;background:#222;flex:none}
.hs{width:22px;height:22px;border-radius:6px;vertical-align:middle}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
.pw{background:#4fc98a22;color:var(--win)}.pl{background:#e5636d22;color:var(--loss)}
.bar{height:6px;background:#222c3a;border-radius:3px;overflow:hidden;min-width:60px;flex:1}
.bar i{display:block;height:100%;background:var(--gold)}
.dots{display:flex;gap:3px}.dots i{width:10px;height:10px;border-radius:3px;background:var(--loss);flex:none}.dots i.w{background:var(--win)}
.dots.wd{gap:4px;justify-content:center}.dots.wd i{flex:0 1 24px;width:auto;height:16px}
.tm{font:600 13px Inter;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.am{color:#e8a33d}.sa{color:#5b9bea}
tr.me td:first-child{box-shadow:inset 3px 0 var(--gold)}
tr.sel td{background:#f0c35a1c}
.items{display:flex;flex-wrap:wrap;gap:8px}
.it{width:62px;text-align:center;font-size:10px;color:var(--mu);line-height:1.2}
.it img{width:48px;height:48px;border-radius:8px;background:#222;display:block;margin:0 auto 3px;border:2px solid #2a3442}
.it.spirit img{border-color:#b078e8}.it.weapon img{border-color:#e8a33d}.it.vitality img{border-color:#6cc17a}
.stack{display:flex;height:16px;border-radius:5px;overflow:hidden;margin:4px 0 12px}
/* master-detail */
.v{display:none}.v.on{display:block}
.split{display:grid;grid-template-columns:380px minmax(0,1fr);height:100vh}
.lp{border-right:1px solid var(--line);overflow-y:auto;background:#0c1117}
.lh{padding:18px 16px 12px;position:sticky;top:0;background:#0c1117;z-index:2;border-bottom:1px solid var(--line)}
.lh p{color:var(--mu);font-size:12px;margin:2px 0 10px}
.lh input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:7px 10px;font:13px Inter}
.li{display:block;color:inherit;text-decoration:none;padding:12px 16px;border-bottom:1px solid #161d27;border-left:3px solid transparent}
.li:hover{background:#121922}
.li.sel{background:#f0c35a14;border-left-color:var(--gold)}
.li .r1,.li .r2{display:flex;align-items:center;gap:10px}
.li .r2{margin-top:6px;color:var(--mu);font-size:12px;gap:8px}
.li .nm{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .big{font:600 17px Inter}
.li svg{display:block}
.sec{padding:10px 16px 6px;color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.1em;background:#0a0e13;border-bottom:1px solid #161d27}
.dp{overflow-y:auto;padding:22px 26px 40px;min-width:0}
.ov{height:100vh;overflow-y:auto;padding:24px 28px 40px}
.ov>.in{max-width:2200px}
.ph1{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;gap:12px}
.ph1 p{color:var(--mu)}
.bk{display:none;background:none;border:0;color:var(--gold);cursor:pointer;font:500 13px Inter;margin-bottom:12px;text-decoration:none}
.fl{display:flex;flex-direction:column;flex:1}
.fl>*{flex:1;min-height:36px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #1d2531}
.fl>*:last-child{border-bottom:0}
.fl .sp{margin-left:auto;text-align:right}
a.row{color:inherit;text-decoration:none}a.row:hover{background:#1a222d}
.ch{flex:1;min-height:140px;position:relative}.ch svg{position:absolute;inset:0;width:100%;height:100%}
.ax{display:flex;justify-content:space-between;color:var(--mu);font-size:11px;margin-top:4px}
.hd{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.hd .big{width:84px;height:84px;border-radius:18px;object-fit:cover;background:#222}
.hd .st{border-left:1px solid var(--line);padding-left:18px}
.hd .st .l{color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.07em}
.hd .st .v{font:600 18px Inter;display:flex;align-items:center;gap:8px}
.tag{font-size:10px;color:var(--mu);border:1px solid var(--line);border-radius:99px;padding:1px 7px;margin-left:6px;text-transform:none;letter-spacing:0}
.lead{height:10px;border-radius:5px;overflow:hidden;display:flex;margin-top:14px;background:#222c3a}
.lead i{display:block;height:100%}
#lab{position:fixed;right:10px;bottom:10px;background:#000c;color:var(--gold);font:600 11px Inter;padding:5px 9px;border-radius:6px;z-index:50;border:1px solid #f0c35a55;pointer-events:none}
@media(max-width:1500px){.split{grid-template-columns:330px minmax(0,1fr)}.s2{grid-column:span 4}.s3,.s4,.s5,.s6,.s7,.s8{grid-column:span 12}}
@media(max-width:820px){
 #top{display:flex}#side{transform:translateX(-100%)}#side.open{transform:none;box-shadow:0 0 0 100vmax #0009}
 main{margin:0;height:auto;overflow:visible}
 .split{display:block;height:auto}.lp{overflow:visible;border:0}.lh{position:static}
 .dp{display:none;overflow:visible;padding:16px}.split.det .lp{display:none}.split.det .dp{display:block}
 .bk{display:inline-block}.ov{height:auto;padding:16px}
 .s2,.s3{grid-column:span 6}.s4{grid-column:span 12}
}
@media(max-width:480px){.s2,.s3{grid-column:span 12}}
</style></head><body>
<div id="top"><button onclick="side.classList.toggle('open')" aria-label="Menu">☰</button><b style="font:700 16px Cinzel;color:var(--gold)">THE PITBOSS</b></div>
<nav id="side"><div class="logo">THE PITBOSS</div><div id="nav"></div>
<div class="srv"><b id="srvn"></b>Data: deadlock-api.com<br>Last 30 days</div></nav>
<main>
<section class="v" id="v-overview"></section><section class="v" id="v-leaderboards"></section><section class="v" id="v-players"></section><section class="v" id="v-matches"></section><section class="v" id="v-heroes"></section><section class="v" id="v-scrims"></section>
</main>
<dialog id="itd" onclick="if(event.target===this)this.close()"></dialog>
<script>
const D=/*DATA*/null;
const $=s=>document.getElementById(s),P=D.P,byId=Object.fromEntries(P.map(p=>[p.id,p]));
const IC={overview:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',leaderboards:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/>',players:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2.5.7 4 2.5 4 6"/>',matches:'<path d="M4 6h16M4 12h16M4 18h10"/>',heroes:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',scrims:'<path d="M3 3l11 11M3 7V3h4M21 3L10 14M21 7V3h-4M6 15l3 3M15 18l3-3M4 20l3-3M20 20l-3-3"/>'};
const TABS=['overview','leaderboards','players','matches','heroes','scrims'];
$('nav').innerHTML=TABS.map(t=>`<button class="nav" data-t="${t}"><svg viewBox="0 0 24 24">${IC[t]}</svg>${t[0].toUpperCase()+t.slice(1)}</button>`).join('');
$('nav').onclick=e=>{const b=e.target.closest('.nav');if(b){location.hash=b.dataset.t;side.classList.remove('open')}};
const f=n=>Math.round(n).toLocaleString('en-US'),pc=(w,n)=>n?Math.round(100*w/n):0,kda=p=>((p.k+p.a)/Math.max(1,p.d)).toFixed(2),kd=(k,d,a)=>((k+a)/Math.max(1,d)).toFixed(2);
const hn=id=>(D.H[id]||['Hero '+id])[0],hi=(id,c='hi')=>D.H[id]?`<img class="${c}" data-h="${id}" src="${D.H[id][1]}" alt="${hn(id)}" loading="lazy">`:`<span class="${c}"></span>`;
const mm=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const ago=t=>{const h=(D.T-t)/3600;return h<1?'just now':h<24?Math.round(h)+'h ago':Math.round(h/24)+'d ago'};
const dt=t=>new Date(t*1000).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const av=(u,n,c='av',st='')=>u?`<img class="${c}" style="${st}" src="${u}" alt="" loading="lazy">`:`<span class="${c} ph" style="${st}">${(n||'?')[0]}</span>`;
const nm=id=>byId[id]?byId[id].name:(D.N[id]||'Player '+String(id).slice(-4));
const rank=p=>{if(!p.tier)return '<span style="color:var(--mu)">Unranked</span>';const r=D.R[p.tier];return `<span style="display:inline-flex;align-items:center;gap:6px;color:var(--mu)"><img src="${r[2]}" width="22" height="22" alt="">${r[1]} ${p.sub}</span>`};
const pill=w=>`<span class="pill ${w?'pw':'pl'}">${w?'WIN':'LOSS'}</span>`;
const wrc=v=>v>=50?'up':'dn';
const spm=g=>g[6]/(g[7]/60),sum=a=>a.reduce((x,y)=>x+y,0),avg=a=>a.length?sum(a)/a.length:0;
const MMid={},ST={},SMF=D.SM;
$('srvn').textContent=P.length+' active players';
// match detail and hero items load on demand; route() re-renders once they arrive
const load=(url,done)=>fetch(url).then(r=>r.ok?r.json():null).catch(()=>null).then(x=>{done(x);route()});
const kpi=(l,v,d,c='')=>`<div class="card kpi s2"><div class="l">${l}</div><div class="v ${c}">${v}</div><div class="d">${d}</div></div>`;
function bars(a,hi,col,lab){const m=Math.max(...a),w=100/a.length;return `<svg viewBox="0 0 100 100" preserveAspectRatio="none">${a.map((v,i)=>{const h=v/m*94;return `<rect x="${i*w+.4}" y="${100-h}" width="${w-.8}" height="${h}" rx=".8" fill="${col?col[i]:i==hi?'#F0C35A':'#3a4a60'}"><title>${lab?lab[i]+' · '+f(v)+(v==1?' match':' matches'):f(v)}</title></rect>`}).join('')}</svg>`}
function spark(a,h=60,fill=1,sw=2,abs=0){const m=Math.max(...a),n=Math.min(...a),r=m-n||1,pts=a.map((v,i)=>`${i/(a.length-1)*300},${h-5-(v-n)/r*(h-10)}`).join(' ');return `<svg viewBox="0 0 300 ${h}" preserveAspectRatio="none" width="100%" height="${abs?'100%':h}">${fill?`<polygon points="0,${h} ${pts} 300,${h}" fill="#F0C35A18"/>`:''}<polyline points="${pts}" fill="none" stroke="#F0C35A" stroke-width="${sw}" vector-effect="non-scaling-stroke"/></svg>`}
function lines(series,cols,grid=4){const all=series.flat(),m=Math.max(...all),n=Math.min(...all,0),r=m-n||1;return `<svg viewBox="0 0 300 100" preserveAspectRatio="none">${Array.from({length:grid},(_,i)=>`<line x1="0" x2="300" y1="${5+i*90/(grid-1)}" y2="${5+i*90/(grid-1)}" stroke="#232c39" vector-effect="non-scaling-stroke"/>`).join('')}${series.map((a,s)=>`<polyline points="${a.map((v,i)=>`${i/(a.length-1)*300},${95-(v-n)/r*90}`).join(' ')}" fill="none" stroke="${cols[s]}" stroke-width="2.2" vector-effect="non-scaling-stroke"/>`).join('')}</svg>`}
const wk=D.SM.filter(m=>m.t>D.T-7*86400);
const allPl=D.SM.flatMap(m=>m.pl),srvWr=pc(sum(allPl.map(x=>x[6])),allPl.length);
const ranked=[...P].sort((a,b)=>b.w/b.n-a.w/a.n);
const HS={};P.forEach(p=>p.hero.forEach(([id,n,w,k,d,a])=>{const h=HS[id]||(HS[id]={id,n:0,w:0,k:0,d:0,a:0,u:0});h.n+=n;h.w+=w;h.k+=k;h.d+=d;h.a+=a;h.u++}));
const HL=Object.values(HS).sort((a,b)=>b.n-a.n);
const streak=p=>{let s=0;const l=p.form[p.form.length-1];for(let i=p.form.length-1;i>=0&&p.form[i]===l;i--)s++;return [l,s]};
const stk=p=>{const [l,s]=streak(p);return `<span class="pill ${l?'pw':'pl'}">${l?'W':'L'}${s}</span>`};
const flt=i=>{const q=i.value.toLowerCase();i.closest('.lp').querySelectorAll('.li').forEach(e=>e.style.display=e.textContent.toLowerCase().includes(q)?'':'none')};
function split(t,title,sub,list,detail,det){const el=$('v-'+t),o=el.querySelector('.lp'),sc=o?o.scrollTop:0;
 // same item re-rendered (e.g. another player in the same match): keep the detail scroll; a new item starts at the top
 const key=location.hash.split('/').slice(0,2).join('/'),same=el.dataset.k===key,od=el.querySelector('.dp'),dsc=od?od.scrollTop:0,wsc=scrollY;el.dataset.k=key;
 el.innerHTML=`<div class="split ${det?'det':''}"><div class="lp"><div class="lh"><h1 style="font-size:18px">${title}</h1><p>${sub}</p><input placeholder="Filter…" oninput="flt(this)"></div>${list}</div><div class="dp"><a class="bk" href="#${t}">← Back to list</a>${detail}</div></div>`;
 const n=el.querySelector('.lp');n.scrollTop=sc;const s=n.querySelector('.li.sel');if(s&&!sc)s.scrollIntoView({block:'nearest'});
 if(same){el.querySelector('.dp').scrollTop=dsc;scrollTo(0,wsc)}}
/* ---------- OVERVIEW ---------- */
function overview(){
 const top=ranked[0],mh=HL[0],gs=P.flatMap(p=>p.g.map(g=>({p,g}))),avgLen=avg(D.SM.map(m=>m.dur));
 const rec=(l,sel,fmt)=>{const b=gs.reduce((a,x)=>sel(x)>sel(a)?x:a);return `<div>${av(b.p.av,b.p.name)}<div><div style="font-size:12px;color:var(--mu)">${l}</div><b>${b.p.name}</b> <span class="mu">· ${hn(b.g[1])}</span></div><div class="sp gold" style="font:600 16px Inter">${fmt(b)}</div></div>`};
 const hot=[...P].sort((a,b)=>{const x=streak(a),y=streak(b);return (y[0]?y[1]:-y[1])-(x[0]?x[1]:-x[1])});
 const maxS=Math.max(...P.map(p=>p.spm));
 $('v-overview').innerHTML=`<div class="ov"><div class="in"><div class="ph1"><div><h1>Overview</h1><p>How the table is doing over the last 30 days.</p></div><span class="mu">${D.total} matches · ${P.reduce((s,p)=>s+p.n,0)} player-games</span></div>
 <div class="grid">
 ${kpi('Matches this week',wk.length,`<span class="up">${D.total}</span> in 30 days`)}
 ${kpi('Server win rate',srvWr+'%',allPl.length+' player-games',wrc(srvWr))}
 ${kpi('Top player',`${av(top.av,top.name)}${top.name}`,pc(top.w,top.n)+'% WR over '+top.n+' games')}
 ${kpi('Most-played hero',`${hi(mh.id)}${hn(mh.id)}`,mh.n+' games · '+pc(mh.w,mh.n)+'% WR')}
 ${kpi('Avg match length',mm(Math.round(avgLen)),'longest '+mm(Math.max(...D.SM.map(m=>m.dur))))}
 ${kpi('Kills / deaths',f(sum(P.map(p=>p.k)))+' / '+f(sum(P.map(p=>p.d))),'server KDA '+(sum(P.map(p=>p.k+p.a))/sum(P.map(p=>p.d))).toFixed(2))}
 </div><div class="grid">
 <div class="card s5"><h2>Server matches per day <small>last 30 days</small></h2><div class="ch">${bars([...D.days].reverse(),-1,D.days.map(()=>'#F0C35A'),D.days.map((_,i)=>{const ago=D.days.length-1-i;return ago?new Date((D.T-ago*86400)*1000).toLocaleDateString(undefined,{month:'short',day:'numeric'}):'Today'}))}</div><div class="ax"><span>30d ago</span><span>15d</span><span>today</span></div></div>
 <div class="card s7"><h2>Form strips <small>last 20 games, oldest → newest</small></h2><div class="fl">${P.map(p=>`<a class="row" href="#players/${p.id}">${av(p.av,p.name)}<b style="width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.name}</b><div class="dots wd" style="flex:1">${p.form.map(w=>`<i class="${w?'w':''}"></i>`).join('')}</div><span class="${wrc(pc(p.w,p.n))}" style="width:44px;text-align:right;font-weight:600">${pc(p.w,p.n)}%</span><span style="width:36px;text-align:right">${stk(p)}</span></a>`).join('')}</div></div>
 </div><div class="grid">
 <div class="card s4"><h2>Records <small>last 30 days</small></h2><div class="fl">
 ${rec('Most kills in a game',x=>x.g[3],x=>x.g[3]+' kills')}${rec('Best KDA',x=>(x.g[3]+x.g[5])/Math.max(1,x.g[4]),x=>kd(x.g[3],x.g[4],x.g[5]))}${rec('Highest souls/min',x=>spm(x.g),x=>f(spm(x.g)))}${rec('Most assists',x=>x.g[5],x=>x.g[5]+' assists')}${rec('Longest match',x=>x.g[7],x=>mm(x.g[7]))}${rec('Most deaths',x=>x.g[4],x=>x.g[4]+' deaths')}</div></div>
 <div class="card s3"><h2>Streaks <small>current</small></h2><div class="fl">${hot.map(p=>`<a class="row" href="#players/${p.id}">${av(p.av,p.name)}<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.name}</span>${stk(p)}</a>`).join('')}</div></div>

 <div class="grid"><div class="card s7"><h2>Server players on ${hn(id)}</h2><div class="tw"><table><thead><tr><th>Player</th><th>Games</th><th>WR</th><th>KDA</th><th>Dmg/min</th><th>Souls/min</th><th>Acc</th></tr></thead><tbody>${pl.map(({p,h,x})=>`<tr class="click" onclick="location.hash='players/${p.id}'"><td class="l"><div class="who">${av(p.av,p.name)}${p.name}</div></td><td>${h[1]}</td><td class="${wrc(pc(h[2],h[1]))}">${pc(h[2],h[1])}%</td><td>${kd(h[3],h[4],h[5])}</td><td>${x?f(x[1]):'–'}</td><td>${x?f(x[2]):'–'}</td><td>${x?x[3]+'%':'–'}</td></tr>`).join('')}</tbody></table></div></div>

 const cell=(b,p)=>`<td class="${b===sel?'cur':''}">${b[0]=='rank'?rank(p):b[4](b[3](p),p)}</td>`;
 const det=`<div class="ph1"><div><h1>${sel[1]}</h1><p>${sel[2]}</p></div><span class="mu">${rows.length} players</span></div><div class="grid">${rows.slice(0,3).map((p,i)=>`<a class="card s4 row" href="#players/${p.id}" style="flex-direction:row;align-items:center;gap:16px;${i==0?'border-color:#f0c35a66':''}"><div style="font:700 36px Cinzel;color:${['#F0C35A','#b8c2d0','#c98b55'][i]}">${i+1}</div>${av(p.av,p.name,'av','width:64px;height:64px')}<div style="flex:1;min-width:0"><b style="font-size:16px">${p.name}</b><div class="mu">${p.n} games · ${pc(p.w,p.n)}% WR</div></div><div style="font:600 24px Inter" class="gold">${sel[4](sel[3](p),p)}</div></a>`).join('')}</div>
 <div class="grid"><div class="card s6"><h2>${sel[1]} <small>all linked players</small></h2><div class="fl">${rows.map((p,i)=>`<a class="row" href="#players/${p.id}"><b class="${i<3?'gold':'mu'}" style="width:18px">${i+1}</b>${av(p.av,p.name)}<span style="width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.name}</span><div class="bar"><i style="width:${sel[3](p)/mxv*100}%"></i></div><b style="width:90px;text-align:right">${sel[4](sel[3](p),p)}</b></a>`).join('')}</div></div>
 <div class="card s6"><h2>Position on every board <small>1 = best</small></h2><div class="tw"><table><thead><tr><th>Player</th>${BD.map(b=>`<th class="${b===sel?'cur':''}">${SH[b[0]]}</th>`).join('')}</tr></thead><tbody>${rows.map(p=>`<tr><td class="l"><div class="who">${av(p.av,p.name)}${p.name}</div></td>${BD.map(b=>{const q=PS[b[0]][p.id];return `<td class="${b===sel?'cur':''}"><span style="display:inline-block;min-width:26px;padding:3px 0;text-align:center;border-radius:6px;font-weight:600;background:rgba(240,195,90,${(.28*(9-q)/8).toFixed(2)});color:${q<=2?'var(--gold)':'var(--tx)'}">${q}</span></td>`}).join('')}</tr>`).join('')}</tbody></table></div></div></div>
 <div class="grid"><div class="card s12"><h2>Full table <small>ranked by ${sel[1]}</small></h2><div class="tw"><table><thead><tr><th>#</th><th class="l">Player</th><th>Games</th>${BD.map(b=>`<th class="${b===sel?'cur':''}">${b[1]}</th>`).join('')}<th>Accuracy</th></tr></thead><tbody>${rows.map((p,i)=>`<tr class="click" onclick="location.hash='players/${p.id}'"><td class="${i<3?'gold':''}">${i+1}</td><td class="l"><div class="who">${av(p.av,p.name)}${p.name}</div></td><td>${p.n}</td>${BD.map(b=>cell(b,p)).join('')}<td>${p.acc}%</td></tr>`).join('')}</tbody></table></div></div></div>`;
 split('leaderboards','Leaderboards',BD.length+' boards · '+P.length+' players',list,det,!!a)}
