services:
  bot:
    build: .
    # values come from .env (docker compose) or the stack's environment variables (Portainer)
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      GUILD_ID: ${GUILD_ID}
      DEADLOCK_API_KEY: ${DEADLOCK_API_KEY:-}
      # recaps link here
      SITE_URL: ${SITE_URL:-https://pitboss.craftyplayz.com}
      # live voice transcripts link here
      DASH_URL: ${DASH_URL:-https://pitstop.craftyplayz.com}
    restart: unless-stopped
    volumes:
      - pitboss-data:/app/data

  web:
    build: .
    command: ["python", "-u", "web.py"]
    environment:
      DEADLOCK_API_KEY: ${DEADLOCK_API_KEY:-}
      WEB_PORT: 8642
      # password for /admin (the API call log viewer); leave empty to turn the page off
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    # put a reverse proxy (with HTTPS) for pitboss.craftyplayz.com in front of this port
    ports:
      - "8642:8642"
    restart: unless-stopped
    volumes:
      - pitboss-data:/app/data

  dash:
    build: .
    command: ["python", "-u", "dash.py"]
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      GUILD_ID: ${GUILD_ID}
      # Developer Portal > your app > OAuth2; add <DASH_URL>/callback as a redirect there
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DASH_URL: ${DASH_URL:-https://pitstop.craftyplayz.com}
      DASH_PORT: 8643
    # put a reverse proxy (with HTTPS) for the DASH_URL host in front of this port
    ports:
      - "8643:8643"
    restart: unless-stopped
    volumes:
      - pitboss-data:/app/data

  # voice clips to text; its own service so the CPU work never slows the bot
  transcriber:
    build: .
    command: ["python", "-u", "transcriber.py"]
    restart: unless-stopped
    volumes:
      - pitboss-data:/app/data

volumes:
  pitboss-data:
