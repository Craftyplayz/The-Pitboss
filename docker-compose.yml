services:
  bot:
    build: .
    # values come from .env (docker compose) or the stack's environment variables (Portainer)
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      GUILD_ID: ${GUILD_ID}
      DEADLOCK_API_KEY: ${DEADLOCK_API_KEY:-}
      # recaps link here
      SITE_URL: ${SITE_URL:-https://deadlock.craftyplayz.com}
    restart: unless-stopped
    volumes:
      - pitboss-data:/app/data

  web:
    build: .
    command: ["python", "-u", "web.py"]
    environment:
      DEADLOCK_API_KEY: ${DEADLOCK_API_KEY:-}
      WEB_PORT: 8642
    # put a reverse proxy (with HTTPS) for deadlock.craftyplayz.com in front of this port
    ports:
      - "8642:8642"
    restart: unless-stopped
    volumes:
      - pitboss-data:/app/data

volumes:
  pitboss-data:
