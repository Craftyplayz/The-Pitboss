 ${C(3,5,H2('Stats','<span class="gold">'+me.nm+'</span> · '+hn(me.hero))+`<div class="mini fl" style="grid-template-columns:repeat(3,1fr);align-content:space-between">${st('K/D/A',me.k+'/'+me.d+'/'+me.a)}${st('KDA',((me.k+me.a)/Math.max(1,me.d)).toFixed(2))}${st('Level',me.lvl)}${st('Souls',f(me.nw))}${st('Souls/min',f(me.nw/mn))}${st('LH / DN',me.lh+'/'+me.dn)}${st('Damage',f(me.dmg))}${st('Dmg/min',f(me.dmg/mn))}${st('Team dmg',Math.round(me.dmg/tdm*100)+'%')}${st('Healing',f(me.heal))}${st('Accuracy',me.acc+'%')}${st('Lost to deaths','-'+f(me.loss),'dn')}</div>`,{n:12})}
 ${C(3,5,H2('Souls by source')+`<div class="stack">${me.src.map((v,i)=>`<i style="width:${v/tot*100}%;background:${SRC[i][1]}" title="${SRC[i][0]}"></i>`).join('')}</div><div class="rows">${me.src.map((v,i)=>`<div class="rw"><i style="width:9px;height:9px;border-radius:2px;background:${SRC[i][1]}"></i><span class="nm" style="flex:1">${SRC[i][0]}</span><span class="mu">${Math.round(v/tot*100)}%</span><span class="val" style="min-width:56px">${f(v)}</span></div>`).join('')}</div>`,{n:12})}
 ${C(6,8,H2('Net worth over time','Amber vs Sapphire team total · '+hn(me.hero)+' below')+`<div style="display:flex;flex-direction:column;flex:1;gap:6px"><div style="flex:3;display:flex;flex-direction:column;min-height:110px">${line([{v:tn(0),c:'#e8a33d',fill:1},{v:tn(1),c:'#5b9bea',fill:1}],{ymax:Math.max(...tn(0),...tn(1))})}</div><div style="flex:2;display:flex;flex-direction:column;min-height:70px">${line([{v:pv,c:'#F0C35A',fill:1}])}</div></div><div class="ax"><span>0:00</span><span>${mm(Math.round(M.dur/2))}</span><span>${mm(M.dur)}</span></div>`,{n:12})}
 ${C(3,6,H2('Team comparison','Amber · Sapphire')+`<div class="rows">${cmp}</div>`,{k:'xo'})}
 </div>
 <div class="grid">${C(6,12,team(0),{k:'bd'})}${C(6,12,team(1),{k:'bd'})}</div>
 <div class="grid">
 ${C(6,8,H2('Final build',`${me.nm} · ${me.items.length} items · ${f(sum(me.items,i=>IT[i][3]))} souls`)+`<div class="items fl" style="align-content:space-around;justify-content:space-around">${me.items.map(i=>`<div class="it ${IT[i][2]}"><img src="${IT[i][1]}" alt="" loading="lazy" title="${f(IT[i][3])} souls">${IT[i][0]}</div>`).join('')}</div>`,{n:12})}
 ${bar2('dmg','Damage')}${bar2('heal','Healing')}${C(3,6,H2('Accuracy','top 8')+`<div class="rows">${[...M.pl].sort((a,b)=>b.acc-a.acc).slice(0,8).map(x=>`<div class="rw">${hi(x.hero,'hi hs')}<span class="nm" style="flex:0 1 40%">${x.nm}</span><div class="bar"><i style="width:${x.acc}%;background:${x.team?'#5b9bea':'#e8a33d'}"></i></div><span class="val">${x.acc}%</span></div>`).join('')}</div>`,{k:'xo'})}
 </div>`}
/* ---- heroes ---- */
function heroes(){const mx=HL[0].n,GW=X.GW;
 const gl=(t,m,key,min=1,k)=>{const a=HL.filter(h=>h.n>=min&&GW[h.id]).map(h=>({h,g:GW[h.id],dl:pc(h.w,h.n)-GW[h.id]})).sort((a,b)=>key(a)-key(b)).slice(0,10);
  return C(4,6,H2(t,m)+`<div class="rows">${a.map(x=>`<div class="rw">${hi(x.h.id)}<span class="nm" style="flex:0 1 38%">${hn(x.h.id)}</span><span class="mu" style="flex:1">${x.h.n}g · you ${pc(x.h.w,x.h.n)}%</span><span class="val">${x.g.toFixed(1)}%</span><span class="${x.dl>=0?'up':'dn'}" style="width:34px;text-align:right">${x.dl>=0?'+':''}${x.dl.toFixed(0)}</span></div>`).join('')}</div>`,{k,n:12})};
 const best=HL.filter(h=>h.n>=4).sort((a,b)=>b.w/b.n-a.w/a.n);
 $('v-heroes').innerHTML=`<h1>Heroes</h1><p class="lede">What the table plays, and how well, across all linked players (30 days) — compared with the global win rate.</p>
 <div class="grid">
 ${C(3,5,H2('Pick share','top 20')+`<div class="rows">${HL.slice(0,20).map(h=>`<div class="rw">${hi(h.id)}<span class="nm" style="flex:0 1 36%">${hn(h.id)}</span><div class="bar"><i style="width:${h.n/mx*100}%"></i></div><span class="val">${h.n}</span></div>`).join('')}</div>`)}
 ${C(6,10,H2('All heroes','top 20 of '+HL.length+' played')+`<div class="tw fl"><table><thead><tr><th>Hero</th><th>Games</th><th>Players</th><th>WR</th><th>Global WR</th><th>Δ</th><th>KDA</th><th>LH/g</th><th>Souls/g</th><th>Pick</th></tr></thead><tbody>${HL.slice(0,20).map(h=>{const w=pc(h.w,h.n),g=GW[h.id],dl=g?w-g:0;return `<tr><td><div class="who">${hi(h.id)}${hn(h.id)}</div></td><td>${h.n}</td><td>${h.u.size}</td><td class="${wrc(w)}">${w}%</td><td class="mu">${g?g.toFixed(1)+'%':'–'}</td><td class="${dl>=0?'up':'dn'}">${dl>=0?'+':''}${dl.toFixed(0)}</td><td>${hk(h)}</td><td>${(h.lh/h.n).toFixed(0)}</td><td>${f(h.nw/h.n)}</td><td style="width:70px"><div class="bar"><i style="width:${h.n/mx*100}%"></i></div></td></tr>`}).join('')}</tbody></table></div>`)}
 ${C(3,5,H2('Best win rate','min 4 games')+`<div class="rows">${best.slice(0,9).map(h=>`<div class="rw">${hi(h.id)}<span class="nm" style="flex:0 1 38%">${hn(h.id)}</span><div class="bar"><i style="width:${pc(h.w,h.n)}%;background:var(--win)"></i></div><span class="val up">${pc(h.w,h.n)}%</span></div>`).join('')}</div><div style="height:10px"></div>${H2('Struggling','lowest win rate')}<div class="rows">${best.slice(-9).reverse().map(h=>`<div class="rw">${hi(h.id)}<span class="nm" style="flex:0 1 38%">${hn(h.id)}</span><div class="bar"><i style="width:${pc(h.w,h.n)}%;background:var(--loss)"></i></div><span class="val dn">${pc(h.w,h.n)}%</span></div>`).join('')}</div>`,{n:12})}
 ${C(4,4,H2('Who plays what','top hero per player')+`<div class="rows">${S.map(s=>{const t={};s.r.forEach(g=>t[g[2]]=(t[g[2]]||0)+1);const [id,n]=Object.entries(t).sort((a,b)=>b[1]-a[1])[0];return `<div class="rw">${av(s.p)}<span class="nm" style="flex:0 1 38%">${s.p.name}</span>${hi(id,'hi hs')}<span style="flex:1">${hn(id)}</span><span class="mu">${n}/${s.n}</span></div>`}).join('')}</div>`,{k:'xo',n:12})}
 </div>
 <div class="grid">
 ${gl('Global WR leaders','heroes this table plays',x=>-x.g)}${gl('Global WR laggards','heroes this table plays',x=>x.g)}${gl('Beating the meta','server WR minus global, min 4 games',x=>-x.dl,4)}${gl('Below the meta','server WR minus global, min 4 games',x=>x.dl,4,'xo')}
 </div>`}
function route(){const [t,a]=location.hash.slice(1).split('/');TABS.concat('match').includes(t)?(t==='match'&&match(),go(t,a)):go('overview')}
overview();leaderboards();matches();heroes();players();match();
addEventListener('hashchange',route);route();
</script></body></html>
