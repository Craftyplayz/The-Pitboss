<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Pitboss — Mobile</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0c0a;--card:#1a1612;--card2:#221d17;--line:#33291f;--tx:#f1e8d8;--mut:#9b8e7a;--gold:#e0b04a;--win:#6fcf8e;--loss:#e5675d;--amber:#f0a030;--sap:#4aa3e0}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:#050403;color:var(--tx);font:15px/1.4 Inter,system-ui,sans-serif;overflow-x:hidden}
body{background:radial-gradient(circle at 50% 0,#2a1f10,#050403 70%) fixed}
#app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;box-shadow:0 0 80px #000a;overflow-x:hidden;padding-bottom:84px}
h1,h2,h3,.cz{font-family:Cinzel,serif}
header{position:sticky;top:0;z-index:20;background:#0e0c0aee;backdrop-filter:blur(10px);display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.logo{font:800 17px Cinzel;color:var(--gold);letter-spacing:.5px;flex:1;padding-left:0}
.sw{display:flex;align-items:center;gap:8px;min-height:44px;padding:4px 12px 4px 4px;border-radius:30px;background:var(--card2);border:1px solid var(--line);color:var(--tx);font:500 13px Inter;max-width:200px;cursor:pointer}
.sw img{width:34px;height:34px;border-radius:50%}.sw span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding:16px}
.view{display:none}.view.on{display:block;animation:f .25s}@keyframes f{from{opacity:0;transform:translateY(8px)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
h2{font-size:15px;color:var(--gold);margin:20px 0 10px;letter-spacing:.8px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
h2 a{font:500 13px Inter;color:var(--mut);text-transform:none;min-height:44px;display:flex;align-items:center;cursor:pointer}
.hero{background:linear-gradient(135deg,#3a2a12,#1a1612);text-align:center;padding:22px 16px}
.hero h1{font-size:22px}.hero p{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.st{background:#0003;border-radius:14px;padding:10px 4px;text-align:center}.st b{display:block;font-size:19px}.st small{color:var(--mut);font-size:11px}
.grid .card.st{margin:0}
.car{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 6px;scrollbar-width:none}.car::-webkit-scrollbar{display:none}
.car>*{scroll-snap-align:start;flex:0 0 auto}
.mc{width:150px;border-radius:18px;background:var(--card);border:1px solid var(--line);padding:0;overflow:hidden;color:var(--tx);text-align:left;cursor:pointer;min-height:44px;font:inherit}
.mc img{width:100%;height:100px;object-fit:cover;object-position:top;display:block}
.mc div{padding:8px 10px}.mc b{font-size:14px}.mc small{display:block;color:var(--mut);font-size:12px}
.W{color:var(--win)}.L{color:var(--loss)}
.tag{display:inline-block;font:700 11px Inter;padding:2px 8px;border-radius:20px;background:#0004}
.tag.W{background:#6fcf8e22}.tag.L{background:#e5675d22}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;color:var(--tx);text-align:left;font:inherit;cursor:pointer}
.row:first-child{border-top:0}.row img.p{width:44px;height:44px;border-radius:12px;object-fit:cover}
.row .m{flex:1;min-width:0}.row .m b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .m small{color:var(--mut);font-size:12px}
.rk{width:26px;font:800 15px Cinzel;color:var(--gold);text-align:center}
.pills{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px;scrollbar-width:none}.pills::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;min-height:44px;padding:0 16px;border-radius:30px;border:1px solid var(--line);background:var(--card);color:var(--mut);font:500 14px Inter;cursor:pointer}
.pill.on{background:var(--gold);color:#1a1100;border-color:var(--gold);font-weight:700}
.tile{width:130px;border-radius:18px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.tile img{width:100%;height:130px;object-fit:cover;object-position:top;display:block}.tile div{padding:8px 10px}.tile small{color:var(--mut);display:block;font-size:12px}
.bar{height:6px;border-radius:4px;background:#0006;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--gold)}
.dots{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}.dots i{width:22px;height:22px;border-radius:50%;background:var(--loss)}.dots i.w{background:var(--win)}
.rank{display:flex;gap:16px;align-items:center;margin-bottom:12px}.rank img{width:84px;height:84px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:30;display:flex;background:#14110eF2;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-height:60px;background:none;border:0;color:var(--mut);font:500 11px Inter;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--gold)}
#sheet{position:fixed;inset:0;z-index:50;pointer-events:none}
#sheet .bk{position:absolute;inset:0;background:#000a;opacity:0;transition:.3s}
#sheet .pn{position:absolute;bottom:0;left:50%;width:100%;max-width:430px;height:92vh;transform:translate(-50%,100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);background:var(--bg);border-radius:26px 26px 0 0;overflow-y:auto;overflow-x:hidden;padding:12px 16px 40px;border-top:1px solid var(--gold)}
#sheet.on{pointer-events:auto}#sheet.on .bk{opacity:1}#sheet.on .pn{transform:translate(-50%,0)}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.x{position:absolute;right:12px;top:10px;width:44px;height:44px;border:0;border-radius:50%;background:var(--card2);color:var(--tx);font-size:22px;cursor:pointer}
.sp{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:8px 0}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mut)}.lg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
.sb{display:grid;grid-template-columns:34px 1fr auto;gap:2px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.sb:first-child{border-top:0}
.sb img.p{width:34px;height:34px;border-radius:9px;grid-row:span 2}.sb .it{grid-column:1/4;display:flex;gap:2px;flex-wrap:wrap;margin-top:4px}.sb .it img{width:24px;height:24px;border-radius:5px;background:#000}
.sb b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sb small{color:var(--mut);font-size:11px}
.build{display:flex;flex-wrap:wrap;gap:6px}.build img{width:48px;height:48px;border-radius:10px;background:#000;border:2px solid var(--line)}
.build img.w{border-color:#e0883a}.build img.v{border-color:#7bbf54}.build img.s{border-color:#b27be0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;border-radius:14px;border:0;background:var(--gold);color:#1a1100;font:700 15px Inter;cursor:pointer;margin-top:10px}
.btn.o{background:none;border:1px solid var(--gold);color:var(--gold)}
.lbl{position:fixed;top:6px;left:6px;z-index:99;font:11px Inter;background:#000c;color:#fff;padding:3px 8px;border-radius:8px;pointer-events:none}
.am{color:var(--amber)}.sa{color:var(--sap)}
</style></head><body>
<div class="lbl">Mockup 09 — Mobile-first app</div>
<div id="app">
<header><div class="logo">THE PITBOSS</div><button class="sw" id="swb" aria-label="Switch player"></button></header>
<main>
<section class="view on" id="v-home"></section><section class="view" id="v-matches"></section><section class="view" id="v-leaders"></section><section class="view" id="v-heroes"></section><section class="view" id="v-me"></section>
</main>
<nav id="nav"></nav>
</div>
<div id="sheet"><div class="bk" onclick="closeS()"></div><div class="pn" id="pn"></div></div>

function leaders(key,n){let s=[...PL].sort((a,b)=>key=='rank'?b.r[0]*10+b.r[1]-a.r[0]*10-a.r[1]:b[key]-a[key]);if(n)s=s.slice(0,n);const v=p=>({wr:p.wr+'%',kda:p.kda,spm:p.spm,rank:rn(p)})[key];return s.map((p,i)=>`<button class="row" onclick="pick(${p.id})"><span class="rk">${i+1}</span><img class="p" src="${p.av}" alt=""><div class="m"><b>${p.n}</b><small>${p.g} games · ${hn(p.hero)}</small></div><b class="cz" style="color:var(--gold)">${v(p)}</b></button>`).join('')}
function render(){
const M=D.M,w=M.filter(m=>m.w).length,k=M.reduce((a,m)=>a+m.k,0),d=M.reduce((a,m)=>a+m.d,0),a_=M.reduce((a,m)=>a+m.a,0),spm=Math.round(M.reduce((a,m)=>a+m.nw,0)/M.reduce((a,m)=>a+m.dur/60,0));
$('swb').innerHTML=`<img src="${cur.av}" alt=""><span>${cur.n}</span> ▾`;
$('v-home').innerHTML=`<div class="card hero"><h1>The Back Room</h1><p>8 linked players · deadlock.craftyplayz.com</p><div class="grid"><div class="st"><b>${PL.reduce((a,p)=>a+p.g,0)}</b><small>games logged</small></div><div class="st"><b>${Math.round(PL.reduce((a,p)=>a+p.wr,0)/PL.length)}%</b><small>server win rate</small></div><div class="st"><b>${hn(D.HS[0].h)}</b><small>most played</small></div></div></div>
<h2>Recent matches <a onclick="go('matches')">See all ›</a></h2><div class="car">${M.slice(0,8).map(mcard).join('')}</div>
<h2>Top of the table <a onclick="go('leaders')">Full board ›</a></h2><div class="card">${leaders('wr',3)}</div>
<h2>Hero tiles</h2><div class="car">${D.HS.slice(0,6).map(h=>`<div class="tile"><img src="${hc(h.h)}" alt=""><div><b>${hn(h.h)}</b><small>${h.m} games · ${Math.round(h.w/h.m*100)}% WR</small></div></div>`).join('')}</div>`;
$('v-matches').innerHTML=`<h2 style="margin-top:0">${cur.n} · matches</h2><div class="card">${M.map(mrow).join('')}</div>`;
$('v-leaders').innerHTML=`<h2 style="margin-top:0">Leaderboards</h2><div class="pills" id="pl">${[['wr','Win rate'],['kda','KDA'],['spm','Souls/min'],['rank','Rank']].map(([k,l],i)=>`<button class="pill ${i?'':'on'}" onclick="lb('${k}',this)">${l}</button>`).join('')}</div><div class="card" id="lbl">${leaders('wr')}</div>`;
const mx=Math.max(...D.HS.map(h=>h.m));
$('v-heroes').innerHTML=`<h2 style="margin-top:0">${cur.n} · heroes</h2><div class="car">${D.HS.slice(0,5).map(h=>`<div class="tile"><img src="${hc(h.h)}" alt=""><div><b>${hn(h.h)}</b><small>${h.m} games · ${((h.k+h.a)/Math.max(1,h.d)).toFixed(1)} KDA</small></div></div>`).join('')}</div><h2>All heroes</h2><div class="card">${D.HS.map(h=>`<div class="row" style="cursor:default"><img class="p" src="${hi(h.h)}" alt=""><div class="m"><b>${hn(h.h)}</b><small>${h.k}/${h.d}/${h.a} · ${h.m} games</small><div class="bar"><i style="width:${h.m/mx*100}%"></i></div></div><b class="${h.w/h.m>=.5?'W':'L'}">${Math.round(h.w/h.m*100)}%</b></div>`).join('')}</div>`;
const form=M.slice(0,10);let st=0;for(const m of M){if(m.w==M[0].w)st++;else break}
const best=D.HS[0],nr=D.R[cur.r[0]+1]||D.R[cur.r[0]];
$('v-me').innerHTML=`<div class="card"><div class="rank">${rk(cur)}<div><small style="color:var(--mut)">CURRENT RANK</small><h1 style="font-size:22px">${rn(cur)}</h1><small style="color:var(--mut)">Next: ${nr.n}</small></div></div><div class="bar" style="height:10px"><i style="width:62%"></i></div><small style="color:var(--mut)">62% to promotion</small></div>
<div class="grid"><div class="st card"><b class="${M[0].w?'W':'L'}">${st}${M[0].w?'W':'L'}</b><small>current streak</small></div><div class="st card"><b>${Math.round(w/M.length*100)}%</b><small>win rate</small></div><div class="st card"><b>${((k+a_)/d).toFixed(1)}</b><small>KDA</small></div><div class="st card"><b>${spm}</b><small>souls/min</small></div><div class="st card"><b>${M.length}</b><small>matches</small></div><div class="st card"><b>${k}/${d}</b><small>K/D total</small></div></div>
<h2>Last 10 form</h2><div class="card"><div class="dots">${form.map(m=>`<i class="${m.w?'w':''}"></i>`).join('')}</div><small style="color:var(--mut)">${form.filter(m=>m.w).length}W – ${form.filter(m=>!m.w).length}L, newest left</small></div>
<h2>Best hero</h2><div class="card"><div class="row" style="cursor:default"><img class="p" src="${hi(best.h)}" alt=""><div class="m"><b>${hn(best.h)}</b><small>${best.m} games · ${Math.round(best.w/best.m*100)}% WR · ${((best.k+best.a)/best.d).toFixed(1)} KDA</small></div></div></div>
<h2>Latest match</h2><div class="card">${mrow(M[0])}<button class="btn" onclick="share(this)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.5l6.8-4M8.6 13.5l6.8 4"/></svg><span>Share this match to Discord</span></button><button class="btn o" onclick="openM(${M[0].id})">Open recap</button></div>`}
function lb(k,b){document.querySelectorAll('#pl .pill').forEach(x=>x.classList.toggle('on',x==b));$('lbl').innerHTML=leaders(k)}
function pick(id){cur=PL.find(p=>p.id==id);render();go('me')}
$('swb').onclick=()=>{cur=PL[(PL.indexOf(cur)+1)%PL.length];render()};
function share(b){const s=b.querySelector('span')||b,o=s.textContent;s.textContent='Link copied!';setTimeout(()=>s.textContent=o,1500)}
const SC=['#e0b04a','#6fcf8e','#4aa3e0','#e5675d','#b27be0','#9b8e7a'];
const sbRow=p=>`<div class="sb"><img class="p" src="${hi(p.h)}" alt=""><b>${p.n}${p.id==907065245?' ★':''}</b><b>${p.k}/${p.d}/${p.a}</b><small>${hn(p.h)} · ${kf(p.nw)} souls · ${kf(p.dmg)} dmg</small><small>${p.acc}% acc</small><div class="it">${p.it.map(i=>`<img src="${D.I[i][1]}" title="${D.I[i][0]}" alt="">`).join('')}</div></div>`;
function openM(id){const mi=D.mi,tot=Object.values(me.src).reduce((a,b)=>a+b,0),win=me.t==mi.w;
$('pn').innerHTML=`<div class="grab"></div><button class="x" onclick="closeS()" aria-label="Close">×</button>
<h1 style="font-size:20px;padding-right:48px">${hn(me.h)} <span class="${win?'W':'L'}">${win?'Victory':'Defeat'}</span></h1><small style="color:var(--mut)">Match #${mi.id} · ${mm(mi.dur)} · ${mi.w==0?'Amber':'Sapphire'} won</small>
<h2>Souls by source</h2><div class="card"><b class="cz" style="font-size:22px">${tot.toLocaleString()}</b> <small style="color:var(--mut)">souls earned</small><div class="sp">${Object.values(me.src).map((v,i)=>`<i style="width:${v/tot*100}%;background:${SC[i]}"></i>`).join('')}</div><div class="lg">${Object.entries(me.src).map(([k,v],i)=>`<span><i style="background:${SC[i]}"></i>${k} ${v.toLocaleString()}</span>`).join('')}</div></div>
<h2>Final build</h2><div class="card"><div class="build">${me.it.map(i=>`<img class="${D.I[i][2]}" src="${D.I[i][1]}" title="${D.I[i][0]}" alt="${D.I[i][0]}">`).join('')}</div></div>
<h2 class="am">Amber</h2><div class="card">${D.P.filter(p=>p.t==0).map(sbRow).join('')}</div><h2 class="sa">Sapphire</h2><div class="card">${D.P.filter(p=>p.t==1).map(sbRow).join('')}</div>
<button class="btn" onclick="share(this)">Share this match</button>`;
$('sheet').classList.add('on');$('pn').scrollTop=0}
function closeS(){$('sheet').classList.remove('on')}
addEventListener('keydown',e=>e.key=='Escape'&&closeS());
render();go('home');
</script></body></html>
