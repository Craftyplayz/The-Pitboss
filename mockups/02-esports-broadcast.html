.pc .bgi{height:170px;background-size:cover;background-position:center top;position:relative}

}
function ms(){
 $('#v-ms').innerHTML=`<div class="tag">${me.name}</div><h1 class="title">Recent <em>matches</em></h1>`+D.recent.map((m,i)=>`<div class="mr ${m.win?'w':''} ${i?'dim':''}" ${i?'':'onclick="go(\'md\')"'}><span class="st"></span>${hi(m.h,m.team)}<div><div class="res ${m.win?'A':'S'}">${m.win?'VICTORY':'DEFEAT'}</div><div class="tag">${hero(m.h).n} · ${ago(m.t)}</div></div><div class="num">${m.k}/${m.d}/${m.a}</div><div class="num x">${fmt(m.nw)}</div><div class="num">${mm(m.dur)}</div><div class="num x" style="color:var(--mut);font-size:15px">#${String(m.id).slice(-5)}</div></div>`).join('')+`<div class="note">Only the latest match opens the detail view in this mockup.</div>`;
}
const SRC=[['Kills','#ff4d5e'],['Lane creeps','#35d07f'],['Neutrals','#ffd24a'],['Boss','#b07cff'],['Treasure','#2f8cff'],['Passive / other','#5b6682']];
let sel=ME;
function graph(){
 const W=800,H=230,mid=H/2,tl=[[0,0,0],...M.tl],mt=M.dur;
 const d=tl.map(r=>[r[0],r[1]-r[2]]),mx=Math.max(...d.map(x=>Math.abs(x[1])))*1.15;
 const X=t=>40+(W-50)*t/mt,Y=v=>mid-(v/mx)*(mid-16);
 const pts=d.map(x=>X(x[0]).toFixed(1)+','+Y(x[1]).toFixed(1)).join(' ');
 const area=`M${X(0)},${mid} L${pts.replace(/ /g,' L')} L${X(mt)},${mid} Z`;
 const v=Math.round(mx*.6/1000)*1000||1000;
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block"><defs><clipPath id="cu"><rect x="0" y="0" width="${W}" height="${mid}"/></clipPath><clipPath id="cd"><rect x="0" y="${mid}" width="${W}" height="${mid}"/></clipPath>
 <linearGradient id="ga" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff9f1c" stop-opacity=".15"/><stop offset="1" stop-color="#ff9f1c" stop-opacity=".85"/></linearGradient><linearGradient id="gs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f8cff" stop-opacity=".15"/><stop offset="1" stop-color="#2f8cff" stop-opacity=".85"/></linearGradient></defs>
 <line x1="40" x2="${W-10}" y1="${Y(v)}" y2="${Y(v)}" stroke="#26304a" stroke-dasharray="3 5"/><line x1="40" x2="${W-10}" y1="${Y(-v)}" y2="${Y(-v)}" stroke="#26304a" stroke-dasharray="3 5"/><text x="34" y="${Y(v)+4}" text-anchor="end">+${v/1000}k</text><text x="34" y="${Y(-v)+4}" text-anchor="end">+${v/1000}k</text>
 <path d="${area}" fill="url(#ga)" clip-path="url(#cu)"/><path d="${area}" fill="url(#gs)" clip-path="url(#cd)"/>
 <line x1="40" x2="${W-10}" y1="${mid}" y2="${mid}" stroke="#e8edf7" stroke-width="1.5"/>
 <polyline points="${pts}" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
 ${d.map(x=>`<circle cx="${X(x[0])}" cy="${Y(x[1])}" r="3.5" fill="${x[1]>=0?'#ff9f1c':'#2f8cff'}" stroke="#fff"/>`).join('')}
 <text x="46" y="16" style="fill:#ff9f1c">AMBER LEAD</text><text x="46" y="${H-6}" style="fill:#7cb8ff">SAPPHIRE LEAD</text>
 ${[0,10,20,30].filter(m=>m*60<mt).map(m=>`<text x="${X(m*60)}" y="${mid+14}" text-anchor="middle">${m}m</text>`).join('')}</svg>`;
}
function board(t){
 const a=M.p.filter(p=>p.team==t).sort((x,y)=>y.nw-x.nw);
 return `<div class="pn sb"><div class="tbar"><span class="${TC[t]}">${T[t].toUpperCase()}</span><span class="badge${M.win==t?'':' lose'}">${M.win==t?'WIN':'LOSS'}</span></div>
 <div class="row hd"><span></span><span>Player</span><span class="num">K/D/A</span><span class="num">Souls</span><span class="num c-lh">LH</span><span class="num c-heal">Dmg</span></div>
 ${a.map(p=>`<div class="row ${p.id==sel?'sel':''}" onclick="sel=${p.id};md()">${hi(p.h,t)}<div><span class="pname">${pName(p.id)}</span><span class="hn">${hero(p.h).n} · Lv ${p.lv}</span></div><span class="num">${p.k}/${p.d}/${p.a}</span><span class="num">${fmt(p.nw)}</span><span class="num c-lh">${p.lh}</span><span class="num c-heal">${fmt(p.dmg)}</span>
 <div class="items">${p.items.map(i=>D.I[i].im?`<img src="${D.I[i].im}" title="${D.I[i].n}" alt="${D.I[i].n}" loading="lazy">`:`<span class="it" title="${D.I[i].n}"></span>`).join('')}</div></div>`).join('')}</div>`;
}
function md(){
 const P=M.p.find(p=>p.id==sel),srcMax=Math.max(...M.p.map(p=>p.nw));
 $('#v-md').innerHTML=`<div class="tag">Match #${M.id} · ${ago(M.st)} · Unranked</div><h1 class="title" style="margin-bottom:10px">Match <em>centre</em></h1>
 <div class="pn vs">${vsHead()}</div>
 <div class="sec"><h2>Souls lead over time</h2><span>sum of net_worth per team</span></div>
 <div class="pn">${graph()}</div>
 <div class="sec"><h2>Scoreboards</h2><span>tap a player for their build</span></div>
 <div class="grid g2">${board(0)}${board(1)}</div>
 <div class="sec"><h2>Final build · <span class="${TC[P.team]}" style="font-size:inherit;color:inherit">${pName(P.id)}</span></h2><span>${hero(P.h).n}</span></div>
 <div class="pn"><div class="bl">${P.items.map(i=>{const it=D.I[i];return `<div class="bi ${it.sl||''}">${it.im?`<img src="${it.im}" alt="">`:'<span class="it"></span>'}<div>${it.n}<small>${it.c?it.c.toLocaleString()+' souls':''}</small></div></div>`}).join('')}</div></div>
 <div class="sec"><h2>Souls by source</h2><span>final totals</span></div>
 <div class="pn"><div class="leg">${SRC.map(s=>`<span><i style="background:${s[1]}"></i>${s[0]}</span>`).join('')}</div>
 ${[0,1].map(t=>M.p.filter(p=>p.team==t).sort((a,b)=>b.nw-a.nw).map(p=>`<div class="src">${hi(p.h,t)}<span class="pname">${pName(p.id)}</span><div class="st" style="width:${100*p.nw/srcMax}%">${p.src.map((v,i)=>`<i style="width:${100*v/p.nw}%;background:${SRC[i][1]}" title="${SRC[i][0]}: ${v.toLocaleString()}"></i>`).join('')}</div><span class="num">${fmt(p.nw)}</span></div>`).join('')).join('<div style="height:8px"></div>')}</div>`;
}
function live(){
 $('#v-live').innerHTML=`<div class="tag">Broadcast · now playing</div><h1 class="title">On <em>air</em></h1><div class="grid g2">`+D.live.map(m=>{
  const tot=m.n0+m.n1,t=[0,1].map(x=>m.pl.filter(p=>p[1]==x));
  return `<div class="pn lc"><div class="top"><span class="now">NOW PLAYING</span><span class="tm" data-st="${m.st}">00:00</span></div>
  <div class="hs"><div>${t[0].map(p=>hi(p[0],0)).join('')}</div><div>${t[1].map(p=>hi(p[0],1)).join('')}</div></div>
  <div class="sbar"><i style="width:${100*m.n0/tot}%;background:linear-gradient(90deg,#c76d00,var(--am))"></i><i style="width:${100*m.n1/tot}%;background:linear-gradient(90deg,var(--sa),#1b5cc0)"></i></div>
  <div class="sbarl"><span class="A">${fmt(m.n0)}</span><span class="S">${fmt(m.n1)}</span></div>
  <div class="meta"><span>#${m.id}</span><span>${m.mode} · ${m.reg}</span><span>${m.spec} watching</span></div></div>`}).join('')+`</div><div class="note">Snapshot of /v1/matches/active; clocks tick locally.</div>`;
 tick();
}
const t0=Date.now();
function tick(){document.querySelectorAll('[data-st]').forEach(e=>{e.textContent=mm(D.snap-e.dataset.st+Math.floor((Date.now()-t0)/1000))})}
setInterval(tick,1000);
const V={home:['Home',home],lb:['Leaderboard',lb],pf:['Profile',pf],ms:['Matches',ms],md:['Match',md],live:['Live',live]};
$('#nav').innerHTML=Object.entries(V).map(([k,v])=>`<button data-k="${k}" class="${k=='live'?'lv':''}" onclick="go('${k}')">${v[0]}</button>`).join('');
function go(k){if(!V[k])k='home';document.querySelectorAll('.v').forEach(e=>e.classList.toggle('on',e.id=='v-'+k));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.k==k));V[k][1]();history.replaceState(0,'','#'+k);scrollTo(0,0)}
addEventListener('hashchange',()=>go(location.hash.slice(1)));
go(location.hash.slice(1));
</script></body></html>
