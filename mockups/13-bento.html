<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Pitboss — Bento grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1319;--side:#0a0e13;--card:#161c25;--line:#232c39;--tx:#dce3ec;--mu:#8190a3;--gold:#F0C35A;--win:#4fc98a;--loss:#e5636d;--r:12px}
*{box-sizing:border-box;margin:0}
html,body{overflow-x:hidden}
body{background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,sans-serif;min-height:100vh}
a{color:var(--gold)}
#side{position:fixed;inset:0 auto 0 0;width:232px;background:var(--side);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:6px;z-index:20;transition:transform .2s}
.logo{font:700 19px Cinzel,serif;color:var(--gold);letter-spacing:.06em;padding:0 10px 4px}
.sub{color:var(--mu);font-size:11px;padding:0 10px 18px;text-transform:uppercase;letter-spacing:.12em}
.nav{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--mu);font:500 14px Inter;padding:10px;border-radius:8px;cursor:pointer;text-align:left;width:100%;margin-bottom:2px}
.nav:hover{background:#121922;color:var(--tx)}
.nav.on{background:#1c2430;color:var(--gold)}
.nav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.srv{margin-top:auto;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:12px;color:var(--mu)}
.srv b{display:block;color:var(--tx);font-size:13px}
#top{display:none;position:sticky;top:0;z-index:15;background:var(--side);border-bottom:1px solid var(--line);padding:10px 16px;align-items:center;gap:12px}
#top button{background:none;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:6px 10px;font-size:18px;cursor:pointer}
main{margin-left:232px;padding:22px 24px 60px;max-width:2200px}
h1{font:600 22px Inter;margin-bottom:2px}
.lede{color:var(--mu);margin-bottom:14px}
h2{font:600 14px Inter;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex:none;white-space:nowrap}
h2 small{color:var(--mu);font-weight:400;font-size:12px;overflow:hidden;text-overflow:ellipsis}
/* bento: 12 equal columns (6 below 1500px), fixed 120px row unit, dense packing */
.bento{display:grid;gap:14px;grid-auto-flow:dense;grid-auto-rows:120px;grid-template-columns:repeat(12,minmax(0,1fr))}
.t{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}.c8{grid-column:span 8}.c12{grid-column:span 12}
.r1{grid-row:span 1}.r2{grid-row:span 2}.r3{grid-row:span 3}.r4{grid-row:span 4}.r7{grid-row:span 7}
.kpi{justify-content:center}
.kpi .l{color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font:600 22px Inter;margin:4px 0 1px;display:flex;align-items:center;gap:8px;overflow:hidden;white-space:nowrap}
.kpi .v span{overflow:hidden;text-overflow:ellipsis}
.kpi .d{font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up{color:var(--win)}.dn{color:var(--loss)}.gold{color:var(--gold)}
.tw{flex:1;min-height:0;overflow:auto}
table{width:100%;height:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mu);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.07em;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none;height:1px}
td{padding:4px 8px;border-bottom:1px solid #1d2531;text-align:right;white-space:nowrap}
th:first-child,td:first-child,th.l,td.l{text-align:left}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#1a222d}
tr.click{cursor:pointer}
.who{display:flex;align-items:center;gap:9px}
.av{width:30px;height:30px;border-radius:50%;object-fit:cover;background:#222;flex:none}
.av.sm{width:26px;height:26px}.av.big{width:72px;height:72px;border-radius:16px}
.hi{width:30px;height:30px;border-radius:8px;object-fit:cover;background:#222;flex:none}
.hs{width:22px;height:22px;border-radius:6px;vertical-align:middle}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
.pw{background:#4fc98a22;color:var(--win)}.pl{background:#e5636d22;color:var(--loss)}
.bar{height:6px;background:#222c3a;border-radius:3px;overflow:hidden;min-width:40px}
.bar i{display:block;height:100%;background:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{background:var(--card);border:1px solid var(--line);color:var(--mu);border-radius:99px;padding:5px 12px 5px 5px;font:500 13px Inter;cursor:pointer;display:flex;align-items:center;gap:8px}
.chip img{width:22px;height:22px;border-radius:50%}
.chip.on{border-color:var(--gold);color:var(--gold)}
.dots{display:flex;gap:3px;flex-wrap:wrap}.dots i{width:11px;height:11px;border-radius:3px;background:var(--loss)}.dots i.w{background:var(--win)}
.dots.big i{width:20px;height:20px;border-radius:5px}.li .dots.big i{width:14px;height:14px}
.tm{font:600 13px Inter;margin-bottom:6px;display:flex;gap:10px;align-items:center;flex:none}
.am{color:#e8a33d}.sa{color:#5b9bea}
tr.me td:first-child{box-shadow:inset 3px 0 var(--gold)}
tr.sel td{background:#f0c35a1c}
.items{display:flex;flex-wrap:wrap;gap:8px;align-content:space-around;flex:1}
.it{width:92px;font-size:11px;text-align:center;font-size:10px;color:var(--mu);line-height:1.2}
.it img{width:72px;height:72px;border-radius:8px;background:#222;display:block;margin:0 auto 3px;border:2px solid #2a3442}
.it.spirit img{border-color:#b078e8}.it.weapon img{border-color:#e8a33d}.it.vitality img{border-color:#6cc17a}
.stack{display:flex;height:18px;border-radius:5px;overflow:hidden;margin:6px 0 10px;flex:none}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--mu)}.leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.back{background:none;border:0;color:var(--gold);cursor:pointer;font:500 13px Inter;margin-bottom:6px}
.vw{display:none}.vw.on{display:block}
.ch{flex:1;min-height:0}.ch svg{display:block;width:100%;height:100%}
.ax{display:flex;justify-content:space-between;color:var(--mu);font-size:11px;flex:none;margin-top:3px}
.ls{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between;gap:5px}
.li{display:flex;align-items:center;gap:9px;min-height:0}
.li .lm{flex:1;min-width:0}
.li .ln{display:flex;justify-content:space-between;gap:8px;font-size:12px;line-height:1.3;margin-bottom:2px}
.li .ln span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .ln b{font-weight:600;white-space:nowrap}
.li .rk{width:14px;color:var(--mu);font-size:11px;text-align:center;flex:none}
.li img.hi,.li img.av{width:26px;height:26px}
.li.t3 .rk{color:var(--gold)}
.two{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.two>div{display:flex;flex-direction:column;min-height:0}
.two h3{font:600 11px Inter;color:var(--mu);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.hero{flex-direction:row;align-items:center;gap:12px;border-left:3px solid var(--win)}
.hero.lo{border-left-color:var(--loss)}
.hero img{width:52px;height:52px;border-radius:12px;flex:none;object-fit:cover;background:#222}
.hero .m{flex:1;min-width:0}.hero b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero small{display:block;color:var(--mu);font-size:11.5px}
.pf{flex-direction:row;align-items:center;gap:14px;flex-wrap:wrap;align-content:center}
#lab{position:fixed;right:10px;bottom:10px;background:#000c;color:var(--gold);font:600 11px Inter;padding:5px 9px;border-radius:6px;z-index:50;border:1px solid #f0c35a55;pointer-events:none}

@media(max-width:820px){#top{display:flex}#side{transform:translateX(-100%)}#side.open{transform:none;box-shadow:0 0 0 100vmax #0009}main{margin:0;padding:18px 12px 70px}.bento{grid-template-columns:repeat(2,minmax(0,1fr))}.c3,.c4,.c6,.c8,.c12{grid-column:span 2}}
