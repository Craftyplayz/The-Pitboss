<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Pitboss — Sidebar dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1319;--side:#0a0e13;--card:#161c25;--line:#232c39;--tx:#dce3ec;--mu:#8190a3;--gold:#F0C35A;--win:#4fc98a;--loss:#e5636d;--r:12px}
*{box-sizing:border-box;margin:0}
html,body{overflow-x:hidden}
body{background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,sans-serif;min-height:100vh}
a{color:var(--gold)}
#side{position:fixed;inset:0 auto 0 0;width:232px;background:var(--side);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:6px;z-index:20;transition:transform .2s}
.logo{font:700 19px Cinzel,serif;color:var(--gold);letter-spacing:.06em;padding:0 10px 4px}
.sub{color:var(--mu);font-size:11px;padding:0 10px 18px;text-transform:uppercase;letter-spacing:.12em}
.nav{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--mu);font:500 14px Inter;padding:10px;border-radius:8px;cursor:pointer;text-align:left;width:100%;margin-bottom:2px}
.nav:hover{background:#121922;color:var(--tx)}
.nav.on{background:#1c2430;color:var(--gold)}
.nav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.srv{margin-top:auto;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:12px;color:var(--mu)}
.srv b{display:block;color:var(--tx);font-size:13px}
#top{display:none;position:sticky;top:0;z-index:15;background:var(--side);border-bottom:1px solid var(--line);padding:10px 16px;align-items:center;gap:12px}
#top button{background:none;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:6px 10px;font-size:18px;cursor:pointer}
main{margin-left:232px;padding:28px 32px 70px;max-width:1280px}
h1{font:600 22px Inter;margin-bottom:4px}
.lede{color:var(--mu);margin-bottom:22px}
h2{font:600 14px Inter;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
h2 small{color:var(--mu);font-weight:400;font-size:12px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(12,minmax(0,1fr));margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.kpi .l{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.kpi .v{font:600 26px Inter;margin:6px 0 2px;display:flex;align-items:center;gap:10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.kpi .d{font-size:12px;color:var(--mu)}
.up{color:var(--win)}.dn{color:var(--loss)}.gold{color:var(--gold)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mu);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.07em;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
th.sort{cursor:pointer}th.sort:hover{color:var(--tx)}th.cur{color:var(--gold)}
td{padding:9px 10px;border-bottom:1px solid #1d2531;text-align:right;white-space:nowrap}
th:first-child,td:first-child,th.l,td.l{text-align:left}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#1a222d}
tr.click{cursor:pointer}
.who{display:flex;align-items:center;gap:10px}
.av{width:30px;height:30px;border-radius:50%;object-fit:cover;background:#222;flex:none}
.hi{width:30px;height:30px;border-radius:8px;object-fit:cover;background:#222;flex:none}
.hs{width:22px;height:22px;border-radius:6px;vertical-align:middle}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
.pw{background:#4fc98a22;color:var(--win)}.pl{background:#e5636d22;color:var(--loss)}
.bar{height:6px;background:#222c3a;border-radius:3px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{background:var(--card);border:1px solid var(--line);color:var(--mu);border-radius:99px;padding:5px 12px 5px 5px;font:500 13px Inter;cursor:pointer;display:flex;align-items:center;gap:8px}
.chip img{width:22px;height:22px;border-radius:50%}
.chip.on{border-color:var(--gold);color:var(--gold)}
.dots{display:flex;gap:4px;flex-wrap:wrap}.dots i{width:12px;height:12px;border-radius:3px;background:var(--loss)}.dots i.w{background:var(--win)}
.prof{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.prof .big{width:72px;height:72px;border-radius:16px}
.rk{width:56px;height:56px}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:14px}
.mini .l{color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.07em}.mini .v{font:600 20px Inter}
.tm{font:600 13px Inter;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.am{color:#e8a33d}.sa{color:#5b9bea}
tr.me td:first-child{box-shadow:inset 3px 0 var(--gold)}
tr.sel td{background:#f0c35a1c}
.items{display:flex;flex-wrap:wrap;gap:8px}
.it{width:62px;text-align:center;font-size:10px;color:var(--mu);line-height:1.2}
.it img{width:48px;height:48px;border-radius:8px;background:#222;display:block;margin:0 auto 3px;border:2px solid #2a3442}
.it.spirit img{border-color:#b078e8}.it.weapon img{border-color:#e8a33d}.it.vitality img{border-color:#6cc17a}
.stack{display:flex;height:16px;border-radius:5px;overflow:hidden;margin:10px 0}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--mu)}.leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.back{background:none;border:0;color:var(--gold);cursor:pointer;font:500 13px Inter;margin-bottom:12px}
.v{display:none}.v.on{display:block}
#lab{position:fixed;right:10px;bottom:10px;background:#000c;color:var(--gold);font:600 11px Inter;padding:5px 9px;border-radius:6px;z-index:50;border:1px solid #f0c35a55;pointer-events:none}
@media(max-width:1000px){.s3{grid-column:span 6}.s4,.s5,.s6,.s7,.s8{grid-column:span 12}}
@media(max-width:820px){#top{display:flex}#side{transform:translateX(-100%)}#side.open{transform:none;box-shadow:0 0 0 100vmax #0009}main{margin:0;padding:18px 16px 70px}}
@media(max-width:480px){.s3{grid-column:span 12}}

 <div class="card s5"><h2>Recent games</h2><div class="tw"><table><tbody>${p.recent.map(m=>`<tr class="click" onclick="openMatch()"><td class="l">${pill(m[7])}</td><td class="l">${hi(m[1],'hi hs')}</td><td>${m[3]}/${m[4]}/${m[5]}</td><td>${ago(m[2])}</td></tr>`).join('')}</tbody></table></div></div></div>`}
function matches(){$('v-matches').innerHTML=`<h1>Matches</h1><p class="lede">${D.total} matches with at least one linked player in the last 30 days. Any row opens the sample match detail.</p>
 <div class="card"><div class="tw"><table><thead><tr><th>Result</th><th class="l">Heroes</th><th class="l">Players</th><th>Party</th><th>Length</th><th>When</th></tr></thead><tbody>${D.SM.slice(0,25).map(matchRow).join('')}</tbody></table></div></div>`}
let selM=907065245;
function openMatch(){go('match');match()}
function match(){const M=D.M,me=M.pl.find(x=>x.id===selM)||M.pl[0],SRC=[['Lane creeps','#F0C35A'],['Neutrals','#4fc98a'],['Heroes','#e5636d'],['Bosses','#b078e8'],['Treasure','#5b9bea'],['Denies','#8190a3']],tot=me.src.reduce((a,b)=>a+b,0);
 const team=t=>`<div class="card s12"><div class="tm ${t?'sa':'am'}">${t?'SAPPHIRE':'AMBER'} ${M.win===t?'<span class="pill pw">WIN</span>':'<span class="pill pl">LOSS</span>'}<span style="color:var(--mu);font-weight:400">${f(M.pl.filter(x=>x.team===t).reduce((a,x)=>a+x.nw,0))} souls</span></div><div class="tw"><table><thead><tr><th>Player</th><th>K/D/A</th><th>Souls</th><th>LH/DN</th><th>Damage</th><th>Healing</th><th>Acc</th><th class="l">Build</th></tr></thead><tbody>${M.pl.filter(x=>x.team===t).map(x=>`<tr class="click ${byId[x.id]?'me':''} ${x.id===me.id?'sel':''}" onclick="selM=${x.id};match()"><td class="l"><div class="who">${hi(x.hero)}<span>${byId[x.id]?'★ ':''}${x.nm}</span></div></td><td>${x.k}/${x.d}/${x.a}</td><td>${f(x.nw)}</td><td>${x.lh}/${x.dn}</td><td>${f(x.dmg)}</td><td>${f(x.heal)}</td><td>${x.acc}%</td><td class="l">${x.items.slice(0,12).map(i=>`<img class="hs" src="${D.IT[i][1]}" alt="" title="${D.IT[i][0]}">`).join('')}</td></tr>`).join('')}</tbody></table></div></div>`;
 $('v-match').innerHTML=`<button class="back" onclick="go('matches')">← All matches</button><h1>Match #${M.id}</h1><p class="lede">${mm(M.dur)} · ${ago(M.t)} · ${M.win?'Sapphire':'Amber'} victory · ★ = linked player · click a row to inspect</p>
 <div class="grid">${team(0)}${team(1)}</div>
 <div class="grid"><div class="card s5"><h2>Souls by source <small>${me.nm} · ${hn(me.hero)}</small></h2><div class="stack">${me.src.map((v,i)=>`<i style="width:${v/tot*100}%;background:${SRC[i][1]}" title="${SRC[i][0]}"></i>`).join('')}</div><div class="leg">${me.src.map((v,i)=>`<span><i style="background:${SRC[i][1]}"></i>${SRC[i][0]} ${f(v)}</span>`).join('')}</div><p style="color:var(--mu);font-size:12px;margin-top:12px">Lost to deaths: <span class="dn">-${f(me.loss)}</span></p></div>
 <div class="card s7"><h2>Net worth over time <small>${me.nm}</small></h2>${spark(M.curve,120)}</div></div>
 <div class="card"><h2>Final build <small>${me.nm}</small></h2><div class="items">${me.items.map(i=>`<div class="it ${D.IT[i][2]}"><img src="${D.IT[i][1]}" alt="" loading="lazy" title="${f(D.IT[i][3])} souls">${D.IT[i][0]}</div>`).join('')}</div></div>`}
function heroes(){const mx=HL[0].n;$('v-heroes').innerHTML=`<h1>Heroes</h1><p class="lede">What the table plays, and how well, across all linked players (30 days).</p>
 <div class="grid"><div class="card s5"><h2>Pick share <small>top 10</small></h2>${HL.slice(0,10).map(h=>`<div style="display:flex;align-items:center;gap:10px;margin-bottom:9px">${hi(h.id)}<div style="flex:1"><div style="display:flex;justify-content:space-between;font-size:12px"><span>${hn(h.id)}</span><span style="color:var(--mu)">${h.n}</span></div><div class="bar"><i style="width:${h.n/mx*100}%"></i></div></div></div>`).join('')}</div>
 <div class="card s7"><h2>All heroes <small>${HL.length} played</small></h2><div class="tw"><table><thead><tr><th>Hero</th><th>Games</th><th>Players</th><th>WR</th><th>KDA</th></tr></thead><tbody>${HL.map(h=>`<tr><td><div class="who">${hi(h.id)}${hn(h.id)}</div></td><td>${h.n}</td><td>${h.u}</td><td class="${wrc(pc(h.w,h.n))}">${pc(h.w,h.n)}%</td><td>${((h.k+h.a)/Math.max(1,h.d)).toFixed(2)}</td></tr>`).join('')}</tbody></table></div></div></div>`}
overview();leaderboards();matches();heroes();match();go('overview');
</script></body></html>
