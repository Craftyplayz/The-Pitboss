<style>

button,select{font:inherit;color:inherit}
img{display:block}

function nwChart(m,ids){const W=620,Ht=220,L=44,T=10,mx=Math.max(...m.p.map(p=>p.nw)),tx=t=>L+t/m.dur*(W-L-10),ty=v=>Ht-24-v/mx*(Ht-24-T);

return s+'</svg>'}
V.versus=()=>{const [a,b]=S.sel.map(P);if(!a||!b)return `<div class="card">Pick two players with the checkboxes first.</div>`;
let sa=0,sb=0;const rows=M.map(x=>{const va=x[2](a),vb=x[2](b),pa=va/(va+vb)*100;if(va>vb)sa++;else if(vb>va)sb++;return `<div class="tug"><div class="lab">${x[1]}</div><div class="v l A ${va>=vb?'lead':'dim'}">${x[3](va)}</div><div class="tb"><i class="a" style="width:${pa}%"></i><i class="b" style="width:${100-pa}%"></i></div><div class="v B ${vb>=va?'lead':'dim'}">${x[3](vb)}</div></div>`}).join('');
const sh=a.h.filter(h=>b.h.some(g=>g[0]==h[0]));
const hp=sh.length?sh.map(h=>{const g=b.h.find(q=>q[0]==h[0]);return `<div class="row"><b class="A num">${f1(h[2]/h[1]*100)}%</b><span class="mu" style="font-size:12px">${h[1]}g</span>${hi(h[0])}<div class="grow" style="text-align:center">${H(h[0]).n}</div><span class="mu" style="font-size:12px">${g[1]}g</span><b class="B num">${f1(g[2]/g[1]*100)}%</b></div>`}).join(''):`<div class="mu">No heroes in common in their top 8. Most played:</div><div class="row">${a.h.slice(0,3).map(h=>hi(h[0])).join('')}<div class="grow" style="text-align:center">vs</div>${b.h.slice(0,3).map(h=>hi(h[0])).join('')}</div>`;
const o=a.id==ME?b.id:b.id==ME?a.id:0,tg=o&&D.tog[o],ag=o&&D.ag[o];
return `<div class="split"><div class="vs"><div class="who A">${av(a)}<b>${a.n}</b>${rkImg(a)}</div><div class="mid">${sa}<span class="mu" style="font-size:18px"> : </span>${sb}</div><div class="who B">${av(b)}<b>${b.n}</b>${rkImg(b)}</div></div><div class="mu" style="margin-top:8px">${sa>sb?a.n:sb>sa?b.n:'Nobody'} leads in ${Math.max(sa,sb)} of ${M.length} categories</div></div>
<div class="grid g2" style="margin-top:14px"><div class="card"><h3>Tale of the tape</h3>${rows}</div><div class="card"><h3>Radar overlay</h3>${radar(a,b)}<div class="chips" style="justify-content:center"><span class="pill a">${a.n}</span><span class="pill b">${b.n}</span></div><div class="note" style="text-align:center">Axes scaled to the best linked player on the server.</div></div></div>
<div class="grid g2"><div class="card"><h3>Shared hero pool · win rate</h3>${hp}</div>
<div class="card"><h3>Together (same team)</h3>${tg?`<div class="vs"><b class="os win" style="font-size:30px;text-align:right">${tg[1]}</b><span class="mu">wins ·<br>losses</span><b class="os loss" style="font-size:30px">${tg[0]-tg[1]}</b></div><div class="note">${f1(tg[1]/tg[0]*100)}% win rate over ${tg[0]} shared match${tg[0]>1?'es':''}</div>`:`<div class="mu">${o?'Never queued together.':'Shared history is baked in only for '+P(ME).n+' in this mockup.'}</div>`}
<h3 style="margin:14px 0 10px">Against (opposite teams)</h3>${ag?`<div class="vs"><b class="os A" style="font-size:30px;text-align:right">${a.id==ME?ag[1]:ag[0]-ag[1]}</b><span class="mu">${ag[0]} game${ag[0]>1?'s':''}</span><b class="os B" style="font-size:30px">${a.id==ME?ag[0]-ag[1]:ag[1]}</b></div><div class="note">Head-to-head on opposing teams, from enemy-stats</div>`:`<div class="mu">${o?'Never met on opposite teams.':'n/a in sample.'}</div>`}
<button class="btn go" style="margin-top:12px" data-go="match">See them in match ${SAMPLE}</button></div></div>`};
function render(){
 document.getElementById('nav').innerHTML=NAV.map(n=>`<button data-go="${n[0]}" class="${S.v==n[0]?'on':''}">${n[1]}</button>`).join('');
 document.getElementById('main').innerHTML=V[S.v]();
 const [a,b]=S.sel.map(P);
 document.getElementById('tray').innerHTML=`<span class="slot ${a?'a':''}">${a?a.n:'Pick player 1'}</span><b class="os mu">vs</b><span class="slot ${b?'b':''}">${b?b.n:'Pick player 2'}</span><button class="btn go" data-go="versus" ${a&&b?'':'disabled style="opacity:.4"'}>Duel</button>`;
}
function go(v){S.v=v;render();scrollTo(0,0)}
document.addEventListener('click',e=>{const t=e.target;
 const ckb=t.closest('[data-ck]');if(ckb){e.stopPropagation();pickTog(+ckb.dataset.ck);render();return}
 const g=t.closest('[data-go]');if(g){if(!g.disabled)go(g.dataset.go);return}
 const s=t.closest('[data-s]');if(s){S.sort=s.dataset.s;render();return}
 const d=t.closest('[data-duel]');if(d){S.sel=[+d.dataset.duel,+document.getElementById('pv').value];go('versus');return}
 const f=t.closest('[data-f]');if(f){S.foc=+f.dataset.f;render();return}
 const m=t.closest('[data-m]');if(m){go('match');return}
 const p=t.closest('[data-p]');if(p){S.pid=+p.dataset.p;go('profile')}});
document.addEventListener('change',e=>{if(e.target.id=='pp'){S.pid=+e.target.value;render()}});
render();
</script></body></html>
