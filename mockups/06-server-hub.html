<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Pitboss — Server Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--felt:#0c2a20;--felt2:#103629;--ink:#071812;--brass:#c9a24b;--brass2:#e8cf8a;--txt:#efe6cf;--mut:#9fb3a5;--amber:#e0a030;--sap:#4a8fd8;--win:#6cc08b;--loss:#d76a6a;--serif:'Cinzel',Georgia,serif;--body:'Inter',system-ui,sans-serif;--it:'Cormorant Garamond',Georgia,serif}
*{box-sizing:border-box;margin:0}html{overflow-x:hidden}
body{background:radial-gradient(ellipse at top,var(--felt2),var(--felt) 55%,var(--ink));background-attachment:fixed;color:var(--txt);font:15px/1.45 var(--body);min-height:100vh;overflow-x:hidden}
img{max-width:100%}
header{text-align:center;padding:26px 16px 10px}
.logo{font:900 clamp(26px,6vw,46px)/1 var(--serif);letter-spacing:.14em;color:var(--brass2);text-shadow:0 2px 0 #000}
.logo small{display:block;font:italic 500 clamp(14px,3vw,19px) var(--it);letter-spacing:.2em;color:var(--mut);margin-top:6px}
.rule{height:10px;margin:10px auto;max-width:520px;background:linear-gradient(90deg,transparent,var(--brass),transparent);clip-path:polygon(0 50%,45% 40%,50% 0,55% 40%,100% 50%,55% 60%,50% 100%,45% 60%);opacity:.8}
nav{position:sticky;top:0;z-index:5;background:#071812ee;border-block:1px solid #c9a24b55;display:flex;gap:2px;overflow-x:auto;justify-content:center;padding:0 8px;backdrop-filter:blur(6px)}
nav button{background:none;border:0;color:var(--mut);font:600 12px var(--serif);letter-spacing:.14em;text-transform:uppercase;padding:14px 12px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
nav button.on{color:var(--brass2);border-color:var(--brass)}
main{max-width:1060px;margin:0 auto;padding:20px 16px 70px}
.view{display:none}.view.on{display:block}
h2{font:700 clamp(20px,4vw,28px) var(--serif);color:var(--brass2);letter-spacing:.08em;margin:6px 0 4px}
.sub{font:italic 500 17px var(--it);color:var(--mut);margin-bottom:16px}
.card{background:linear-gradient(#0a2219cc,#071812cc);border:1px solid #c9a24b66;box-shadow:inset 0 0 0 3px #071812,inset 0 0 0 4px #c9a24b33;border-radius:4px;padding:16px}
.grid{display:grid;gap:14px}
.awards{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.plaque{text-align:center;padding:20px 14px 16px;background:linear-gradient(160deg,#2a2412,#14110a 60%,#2a2412);border:2px solid var(--brass);border-radius:6px 6px 40px 40px;box-shadow:0 6px 18px #0009,inset 0 0 0 4px #14110a,inset 0 0 0 5px #c9a24b55}
.plaque .t{font:700 15px var(--serif);letter-spacing:.14em;color:var(--brass2);text-transform:uppercase}
.plaque .d{font:italic 500 15px var(--it);color:var(--mut);margin-bottom:10px}
.plaque img.av{width:64px;height:64px;border-radius:50%;border:3px solid var(--brass);object-fit:cover;background:#000}
.plaque .n{font:700 17px var(--serif);margin-top:6px;overflow-wrap:anywhere}
.plaque .v{font:900 26px var(--serif);color:var(--brass2)}.plaque .v small{font:600 12px var(--body);color:var(--mut)}
.plaque .ic{font-size:22px;color:var(--brass)}
.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 18px}
.chip{background:#071812;color:var(--txt);border:1px solid var(--brass);border-radius:99px;padding:7px 15px;font:600 12px var(--serif);letter-spacing:.1em;cursor:pointer;text-transform:uppercase}
.chip.on{background:var(--brass);color:#1a1405}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end;margin-bottom:18px}
.pod{text-align:center;padding:12px 6px;border:1px solid var(--brass);border-radius:6px 6px 0 0;background:linear-gradient(#173f30,#0a2219)}
.pod.p1{padding-bottom:36px}.pod.p2{padding-bottom:20px}.pod.p3{padding-bottom:8px}
.pod img.av{width:54px;height:54px;border-radius:50%;border:3px solid var(--brass);object-fit:cover}
.pod .r{font:900 28px var(--serif);color:var(--brass2)}.pod .n{font:700 13px var(--serif);overflow-wrap:anywhere}.pod .v{font:600 15px var(--body);color:var(--brass2)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:600 11px var(--serif);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);text-align:left;padding:8px 6px;border-bottom:1px solid #c9a24b55}
td{padding:8px 6px;border-bottom:1px solid #ffffff12;vertical-align:middle}
.r{text-align:right}
.pl{display:flex;align-items:center;gap:8px;min-width:0}.pl img{width:30px;height:30px;border-radius:50%;flex:none}
.hero{width:30px;height:30px;border-radius:4px;vertical-align:middle;background:#000}
.W{color:var(--win);font-weight:600}.L{color:var(--loss);font-weight:600}
.bar{height:6px;background:#ffffff18;border-radius:3px;overflow:hidden;min-width:50px}.bar i{display:block;height:100%;background:var(--brass)}
.tw{overflow-x:auto}.tw table{min-width:460px}
.rec{display:flex;gap:14px;align-items:center}.rec img{width:54px;height:54px;border-radius:6px}.big{font:900 26px var(--serif);color:var(--brass2)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin:14px 0 0}
.stat{border:1px solid #c9a24b55;padding:10px;text-align:center;border-radius:4px;background:#071812}.stat b{display:block;font:900 22px var(--serif);color:var(--brass2)}.stat span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em}
.phead{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.phead img.av{width:84px;height:84px;border-radius:50%;border:3px solid var(--brass)}
.bdg{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--serif)}.bdg img{width:30px;height:30px}
.mrow{cursor:pointer}.mrow:hover td{background:#c9a24b14}
.items{display:flex;flex-wrap:wrap;gap:4px}.items img{width:38px;height:38px;border-radius:4px;border:2px solid #555;background:#000}
.items img.weapon{border-color:#d9962c}.items img.vitality{border-color:#6cc08b}.items img.spirit{border-color:#a98ae0}
.tm{border-left:4px solid;margin-bottom:14px}.tm.t0{border-color:var(--amber)}.tm.t1{border-color:var(--sap)}
.tm h3{font:700 15px var(--serif);letter-spacing:.12em;padding:8px 10px}
.src{display:flex;height:22px;border-radius:3px;overflow:hidden;margin:8px 0}.src i{display:block}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mut)}.leg b{display:inline-block;width:10px;height:10px;margin-right:4px;border-radius:2px}
.dist{display:grid;gap:7px}.dr{display:grid;grid-template-columns:104px 1fr 92px;gap:8px;align-items:center;font-size:13px}.dr img{width:22px;vertical-align:middle;margin-right:4px}
.dbar{position:relative;height:20px;background:#ffffff12;border-radius:3px}.dbar i{position:absolute;left:0;top:0;bottom:0;background:#c9a24b77;border-radius:3px}.dbar u{position:absolute;left:0;top:6px;bottom:6px;background:var(--win);border-radius:3px}
.mock{position:fixed;right:8px;bottom:8px;z-index:20;background:#000c;color:var(--brass2);border:1px solid var(--brass);padding:3px 9px;font:600 11px var(--body);border-radius:3px;pointer-events:none}
@media(max-width:560px){.dr{grid-template-columns:90px 1fr 80px}.hide-s{display:none}nav{justify-content:flex-start}.tw table{min-width:0}}
</style></head><body>

const SC=['#e0a030','#6cc08b','#4a8fd8','#d76a6a','#a98ae0','#c9a24b'],SN=['Heroes','Lane creeps','Neutrals','Bosses','Treasure','Denies'];
function match(){const M=D.match,w=M.win;
 const team=t=>`<div class="card tm t${t}" style="padding:0"><h3>${t?'SAPPHIRE':'AMBER'} ${w==t?'&mdash; VICTORS':''}</h3><div class="tw"><table><tr><th>Player</th><th class="r">K/D/A</th><th class="r">Souls</th><th class="r hide-s">LH</th><th class="r hide-s">Dmg</th><th class="r hide-s">Heal</th></tr>${M.pl.filter(p=>p.team==t).map(p=>`<tr ${p.me?'style="background:#c9a24b22"':''}><td><span class="pl"><img src="${p.h.i}" alt=""><span>${E(p.n)}<br><small style="color:var(--mut)">${p.h.n}${p.linked?' &middot; linked':''}</small></span></span></td><td class="r">${p.k}/${p.d}/${p.a}</td><td class="r">${f(p.nw)}</td><td class="r hide-s">${p.lh}</td><td class="r hide-s">${f(p.dmg)}</td><td class="r hide-s">${f(p.heal)}</td></tr>`).join('')}</table></div></div>`;
 const me=M.pl.find(p=>p.me),s=me.src,sum=s.reduce((a,b)=>a+b,0);
 $('#match').innerHTML=`<h2>Match ${M.id}</h2><div class="sub">${w?'Sapphire':'Amber'} won in ${mm(M.du)} &middot; ${ago(M.t)}</div>
 <div class="grid two"><div class="card"><div class="phead"><img class="hero" style="width:56px;height:56px" src="${me.h.i}" alt=""><div><b style="font:700 18px var(--serif)">${E(me.n)}</b><div>${me.h.n} &middot; ${me.k}/${me.d}/${me.a} &middot; <span class="${me.team==w?'W':'L'}">${me.team==w?'Win':'Loss'}</span></div></div></div>
 <div class="sub" style="margin:14px 0 0">Souls by source (${f(sum)})</div><div class="src">${s.map((v,i)=>`<i style="width:${100*v/sum}%;background:${SC[i]}" title="${SN[i]}"></i>`).join('')}</div><div class="leg">${s.map((v,i)=>`<span><b style="background:${SC[i]}"></b>${SN[i]} ${f(v)}</span>`).join('')}</div></div>
 <div class="card"><div class="sub" style="margin:0 0 8px">Final build</div><div class="items">${me.items.map(i=>`<img class="${i.s}" src="${i.im}" title="${E(i.n)} (${f(i.c)})" alt="${E(i.n)}">`).join('')}</div><div class="sub" style="margin:10px 0 0">Accuracy ${me.acc}% &middot; Damage ${f(me.dmg)} &middot; Healing ${f(me.heal)}</div></div></div>
 <div style="margin-top:14px">${team(0)}${team(1)}</div>`}
function ranks(){const mx=Math.max(...D.tiers.map(t=>t.g)),n=D.P.length;
 $('#ranks').innerHTML=`<h2>Rank Spread</h2><div class="sub">Where the house sits against every ranked player in the world.</div><div class="card"><div class="dist">${D.tiers.map(t=>{const sv=100*t.s/n;return `<div class="dr"><span><img src="${t.im}" alt="">${t.n}</span><div class="dbar"><i style="width:${100*t.g/mx}%"></i><u style="width:${Math.min(100,100*sv/mx)}%"></u></div><span>${t.g}% <b style="color:var(--win)">/ ${Math.round(sv)}%</b></span></div>`}).join('')}</div><div class="leg" style="margin-top:12px"><span><b style="background:#c9a24b88"></b>Global share</span><span><b style="background:var(--win)"></b>Server share (${n} players, illustrative)</span></div></div>`}
home();board();player();matches();match();ranks();show('home');
</script></body></html>
