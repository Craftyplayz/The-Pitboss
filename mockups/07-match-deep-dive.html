/* ---------- generic line chart ---------- */
function lineChart(o){
  const W=o.w||800,Hh=o.h||260,l=o.l||44,r=8,t=8,b=o.b||22,iw=W-l-r,ih=Hh-t-b;
  const X=v=>l+v/o.xmax*iw,Y=v=>t+ih-(v-o.ymin)/(o.ymax-o.ymin)*ih;
  let s=`<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${o.label||'chart'}">`;
  (o.yt||[]).forEach(([v,lb])=>s+=`<line class="gl" x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${l-5}" y="${Y(v)+3}" text-anchor="end">${lb}</text>`);
  (o.xt||[]).forEach(([v,lb])=>s+=`<line class="gl" x1="${X(v)}" x2="${X(v)}" y1="${t}" y2="${t+ih}" stroke-dasharray="2 3"/><text x="${X(v)}" y="${t+ih+14}" text-anchor="middle">${lb}</text>`);
  s+=o.pre?o.pre(X,Y,t,ih):'';
  o.series.forEach(q=>s+=`<path class="nwl" ${q.attrs||''} d="${path(q.pts.map(p=>[X(p[0]),Y(p[1])]))}" stroke="${q.c}" ${q.dash?`stroke-dasharray="${q.dash}"`:''} ${q.sw?`style="stroke-width:${q.sw}px"`:''}/>`);
  s+=o.post?o.post(X,Y,t,ih):'';
  return s+'</svg>';
}

   <div class="mono" style="text-align:right"><span class="amb" id="sa"></span> <span style="color:var(--dim)">vs</span> <span class="sap" id="ss"></span><div class="cap" style="margin-top:4px">team souls @ cursor</div></div></div>

function hl(el){

/* ---------- LANE BENCHMARK ---------- */
let laneSel=me.i;
function lane(){
  const P=D.PP,pc=x=>{x=Math.min(100,x);let i=1;while(P[i][0]<x)i++;const a=P[i-1],b=P[i],f=(x-a[0])/(b[0]-a[0]||1);return[a[1]+(b[1]-a[1])*f,a[2]+(b[2]-a[2])*f]};
  const p=D.pl[laneSel];
  const mk=min=>{const t=min*60,v=at(p,1,t),pct=t/M.dur*100,[m,s]=pc(pct);return{min,v,m,s,z:(v-m)/s,pct}};
  const r10=mk(10),r20=mk(20),pctile=z=>Math.round(100/(1+Math.exp(-1.702*z)));
  const card=r=>`<div class="tile"><div class="cap">Souls @ ${r.min} min</div><div class="v">${fmt(r.v)}</div><div class="d"><b class="${r.v>=r.m?'w':'l'}">${r.v>=r.m?'+':''}${fmt(r.v-r.m)}</b> vs avg ${fmt(r.m)} · ~${pctile(r.z)}th pctile</div></div>`;
  const xs=[...Array(41)].map((_,i)=>i*2.5),ymax=45000;
  const chart=lineChart({w:800,h:300,l:46,xmax:100,ymin:0,ymax,label:'Net worth vs server-wide average',xt:[0,25,50,75,100].map(v=>[v,v+'%']),yt:[0,1,2,3,4].map(i=>[i*ymax/4,k1(i*ymax/4)]),
   pre:(X,Y)=>{const up=xs.map(x=>[X(x),Y(pc(x)[0]+pc(x)[1])]),dn=xs.map(x=>[X(x),Y(Math.max(0,pc(x)[0]-pc(x)[1]))]).reverse();return `<path d="${path(up.concat(dn))}Z" fill="#7c8594" opacity=".18"/>`},
   series:[{pts:xs.map(x=>[x,pc(x)[0]]),c:'#9aa3b2',dash:'4 3'},{pts:xs.map(x=>[x,at(p,1,x/100*M.dur)]),c:p.c}],
   post:(X,Y)=>[r10,r20].map(r=>`<line x1="${X(r.pct)}" x2="${X(r.pct)}" y1="8" y2="278" stroke="${AMB}" stroke-dasharray="3 3"/><circle cx="${X(r.pct)}" cy="${Y(r.v)}" r="4" fill="${p.c}" stroke="#fff"/><text x="${X(r.pct)+4}" y="20" style="fill:${AMB}">${r.min}m</text>`).join('')});
  $('#v-lane').innerHTML=`<h1>Lane benchmark</h1><div class="sub">Player net worth against the server-wide average curve (&plusmn;1&sigma;) at the same point in the match.</div>
  <div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:6px">${D.pl.map(q=>`<button class="chip ${q.i==laneSel?'on':''}" data-p="${q.i}">${q.n.slice(0,14)}</button>`).join('')}</div>
  <div class="grid g4" style="margin-top:14px"><div class="tile"><div class="cap">Hero</div><div class="v" style="font-size:16px;margin-top:10px">${hi(p.h)} ${hero(p.h)[0]}</div><div class="d">${TN[p.t]} · ${p.k}/${p.d}/${p.as}</div></div>${card(r10)}${card(r20)}<div class="tile"><div class="cap">Final souls</div><div class="v">${k1(p.nw)}</div><div class="d">avg ${k1(pc(100)[0])}</div></div></div>
  <div class="panel"><h2>Net worth vs average · % of match elapsed</h2>${chart}<div class="key" style="margin-top:6px"><span><i style="background:${p.c}"></i>${p.n}</span><span><i style="background:#9aa3b2"></i>Average</span><span><i style="background:#7c8594;opacity:.4"></i>&plusmn;1&sigma; band</span></div>
  <div class="note">The average curve is bucketed by share of match elapsed, so this ${mmss(M.dur)} game's 10 and 20 minute marks sit at ${r10.pct.toFixed(0)}% and ${r20.pct.toFixed(0)}%. Lane-pair souls diff (/v1/analytics/lane-soul-curve) would add an opponent-relative view.</div></div>`;
  document.querySelectorAll('#v-lane .chip').forEach(c=>c.onclick=()=>{laneSel=+c.dataset.p;lane()});
}

/* ---------- router ---------- */
const V={home,leaders,profile,matches,match:matchView,lane},NAME={home:'Home',leaders:'Leaderboards',profile:'Profile',matches:'Matches',match:'Match deep-dive',lane:'Lane benchmark'};
$('#nav').innerHTML=Object.keys(V).map(k=>`<button data-v="${k}">${NAME[k]}</button>`).join('');
function go(v){if(!V[v])v='home';hl(null);document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id=='v-'+v));document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==v));V[v]();history.replaceState(null,'','#'+v);scrollTo(0,0)}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.v)};
go(location.hash.slice(1)||'match');
</script></body></html>
