<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Pitboss — Profiles</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0c10;--panel:#14151b;--panel2:#1a1c24;--line:#2a2a30;--gold:#c9a24b;--gold2:#e8cf8f;--tx:#e9e4d6;--mu:#8d8a80;--win:#5fbf8a;--loss:#d9665a;--amber:#e0a23a;--sap:#4f8fe0}
*{box-sizing:border-box;margin:0}
html,body{overflow-x:hidden}
body{background:radial-gradient(1200px 500px at 50% -100px,#1b1710,transparent),var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,sans-serif;padding-bottom:50px}
a{color:inherit;text-decoration:none}
h1,h2,h3,.cz{font-family:Cinzel,Georgia,serif;letter-spacing:.06em}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--gold);position:sticky;top:0;background:#0b0c10ee;backdrop-filter:blur(6px);z-index:20}
.logo{font:700 20px Cinzel,serif;color:var(--gold2);letter-spacing:.14em}
.logo small{display:block;font:500 9px Inter;color:var(--mu);letter-spacing:.3em}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav a,.tabs a{padding:7px 12px;border:1px solid transparent;color:var(--mu);font:600 12px Cinzel,serif;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
nav a.on,.tabs a.on{color:var(--gold2);border-color:var(--gold);background:#c9a24b14}
nav a:hover,.tabs a:hover{color:var(--gold2)}
main{max-width:1100px;margin:0 auto;padding:16px}
.deco{position:relative;border:1px solid var(--line);background:var(--panel)}
.deco::before,.deco::after{content:"";position:absolute;width:12px;height:12px;border:1px solid var(--gold);pointer-events:none;z-index:2}
.deco::before{top:-1px;left:-1px;border-right:0;border-bottom:0}.deco::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.sec{font:700 15px Cinzel;color:var(--gold2);margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
.view{display:none}.view.on{display:block}
.banner{position:relative;min-height:230px;background-size:cover;background-position:center top;display:flex;align-items:flex-end;padding:18px;overflow:hidden}
.banner::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0b0c1066,#0b0c10f0 85%),linear-gradient(90deg,#0b0c10cc,transparent 70%)}
.banner>*{position:relative}
.bi{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;width:100%}
.avatar{width:96px;height:96px;border:2px solid var(--gold);padding:3px;background:#000;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.who{flex:1;min-width:180px}
.who h1{font-size:28px;color:#fff;line-height:1.1;overflow-wrap:anywhere}
.who p{color:var(--mu);font-size:12px;margin-top:4px}
.rankbig{text-align:center}.rankbig img{width:96px;height:96px;object-fit:contain;filter:drop-shadow(0 0 12px #c9a24b66)}
.rankbig b{display:block;font:700 12px Cinzel;color:var(--gold2);letter-spacing:.12em}
.heads{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-top:0}
.heads div{background:var(--panel);padding:12px;text-align:center}
.heads b{display:block;font:700 24px Cinzel;color:var(--gold2)}.heads span{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.1em}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--gold);margin-top:14px}
.tabs a{white-space:nowrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.g3{grid-template-columns:1fr 1fr}
@media(max-width:700px){.g3{grid-template-columns:1fr}.heads{grid-template-columns:repeat(2,1fr)}.who h1{font-size:22px}}
.pc{display:block;overflow:hidden;transition:.15s}.pc:hover{border-color:var(--gold);transform:translateY(-2px)}
.pc .mb{height:84px;background-size:cover;background-position:center 15%;position:relative}
.pc .mb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent,var(--panel))}
.pc .bd{padding:0 12px 12px;margin-top:-34px;position:relative;z-index:1;display:flex;gap:10px;align-items:flex-end}
.pc img.a{width:56px;height:56px;border:2px solid var(--gold);background:#000;flex:none;object-fit:cover}
.pc h3{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pc .bd>div{min-width:0;flex:1}
.pc img.rk{width:44px;height:44px;object-fit:contain;flex:none}
.pc .st{display:flex;justify-content:space-between;gap:4px;padding:8px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--mu)}
.pc .st b{color:var(--tx)}
.w{color:var(--win)}.l{color:var(--loss)}
.bar{height:6px;background:#2b2c33;position:relative;min-width:60px}.bar i{display:block;height:100%;background:var(--win)}
table{width:100%;border-collapse:collapse}
th{font:600 11px Inter;color:var(--mu);text-transform:uppercase;letter-spacing:.08em;text-align:left;padding:8px;border-bottom:1px solid var(--gold);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th.s{cursor:pointer}th.s:hover{color:var(--gold2)}
.tw{overflow-x:auto}
.hi{width:32px;height:32px;object-fit:cover;vertical-align:middle;border:1px solid var(--line);margin-right:8px}
.nm{display:flex;align-items:center;white-space:nowrap}
.mrow{display:grid;grid-template-columns:4px 40px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.mrow:hover{background:var(--panel2)}
.mrow .ind{align-self:stretch}
.mrow img{width:40px;height:40px;object-fit:cover}
.mrow small{color:var(--mu);display:block;font-size:11px}
.rel{display:grid;grid-template-columns:40px 1fr 90px;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.rel img{width:40px;height:40px;object-fit:cover;border:1px solid var(--gold)}
.rel .r{text-align:right;font-weight:600}
.rel small{color:var(--mu)}
.mh{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:16px}
.mh h2{font-size:24px}
.items{display:flex;flex-wrap:wrap;gap:3px}.items img{width:30px;height:30px;background:#000;border:1px solid var(--line);object-fit:contain}
.big img{width:46px;height:46px}
.it-weapon{border-color:#d9a05a!important}.it-vitality{border-color:#6fbf6a!important}.it-spirit{border-color:#a57ae0!important}
.srcbar{display:flex;height:22px;margin:8px 0}.srcbar i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px}.leg span::before{content:"";display:inline-block;width:10px;height:10px;margin-right:5px;background:var(--c)}
tr.me td{background:#c9a24b18}
tr.pick{cursor:pointer}tr.pick:hover td{background:var(--panel2)}
.note{font-size:12px;color:var(--mu);padding:10px}
.pad{padding:14px}
#lbl{position:fixed;right:8px;bottom:8px;z-index:50;background:#000c;border:1px solid var(--gold);color:var(--gold2);font:600 11px Inter;padding:4px 9px}
.hero-bar{display:flex;gap:6px;align-items:center}
</style></head><body>
<header class="top"><a href="#home" class="logo">THE PITBOSS<small>DEADLOCK · NEW YORK, 1925</small></a>

</main>

const $=s=>document.querySelector(s);
const P=id=>D.P.find(p=>p.id==id),pct=(a,b)=>b?Math.round(a/b*100):0,kda=p=>((p.k+p.a)/Math.max(1,p.d)).toFixed(2);

const rk=r=>D.R[r[0]].s[r[1]-1];const rn=r=>D.R[r[0]].n+' '+r[1];
const dt=t=>new Date(t*1000).toLocaleDateString('en',{month:'short',day:'numeric'});
const mm=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const wr=(w,n)=>`<b class="${pct(w,n)>=50?'w':'l'}">${pct(w,n)}%</b>`;

function card(p){const h=D.H[topH(p)];return `<a class="pc deco" href="#p/${p.id}"><div class="mb" style="background-image:url(${h.b})"></div><div class="bd"><img class="a" src="${p.av}" alt=""><div><h3>${p.name}</h3><small style="color:var(--mu)">Main: ${h.n}</small></div><img class="rk" src="${rk(p.rank)}" title="${rn(p.rank)}" alt=""></div><div class="st"><span>Win <b>${pct(p.w,p.n)}%</b></span><span>KDA <b>${kda(p)}</b></span><span>Souls/m <b>${p.spm}</b></span><span><b>${p.n}</b> g</span></div></a>`}

<div class="sec">Top of the House</div>${lbTable()}`;sort(v.querySelector('table'),'wr')}
function lbTable(){return `<div class="deco tw"><table class="lb"><thead><tr><th>#</th><th>Player</th><th class="s" data-k="rk">Rank</th><th class="s" data-k="wr">Win %</th><th class="s" data-k="kda">KDA</th><th class="s" data-k="spm">Souls/min</th><th class="s" data-k="n">Games</th></tr></thead><tbody>${D.P.map(p=>`<tr data-wr="${pct(p.w,p.n)}" data-kda="${kda(p)}" data-spm="${p.spm}" data-n="${p.n}" data-rk="${p.rank[0]*10+p.rank[1]}"><td class="ix"></td><td><a class="nm" href="#p/${p.id}"><img class="hi" src="${p.av}" alt="">${p.name}</a></td><td><span class="nm"><img class="hi" style="border:0;object-fit:contain" src="${rk(p.rank)}" alt="">${rn(p.rank)}</span></td><td>${wr(p.w,p.n)}</td><td>${kda(p)}</td><td>${p.spm}</td><td>${p.n}</td></tr>`).join('')}</tbody></table></div>`}
function sort(t,k){const b=t.tBodies[0];[...b.rows].sort((a,c)=>c.dataset[k]-a.dataset[k]).forEach((r,i)=>{b.append(r);r.querySelector('.ix').textContent=i+1});t.querySelectorAll('th.s').forEach(h=>h.style.color=h.dataset.k==k?'var(--gold2)':'')}
function lb(){const v=$('#v-lb');v.innerHTML=`<div class="sec">Server Leaderboards</div><p class="note">Click a column header to rank by it. Linked players only.</p>${lbTable()}`;sort(v.querySelector('table'),'wr')}
document.addEventListener('click',e=>{const h=e.target.closest('th.s');if(h)sort(h.closest('table'),h.dataset.k)});
function matchRows(p,n){return p.rec.slice(0,n).map(m=>{const h=D.H[m[1]];const w=m[9];return `<a class="mrow" href="#m/${m[0]}"><i class="ind" style="background:${w?'var(--win)':'var(--loss)'}"></i><img src="${h.i}" alt=""><div><b>${h.n}</b> <span class="${w?'w':'l'}">${w?'Victory':'Defeat'}</span><small>${dt(m[2])} · ${mm(m[8])} · ${m[7]} CS</small></div><div style="text-align:right"><b>${m[3]}/${m[4]}/${m[5]}</b><small>${Math.round(m[6]/m[8]*60)} souls/m</small></div></a>`}).join('')}
function heroRows(p){return `<div class="deco tw"><table><thead><tr><th>Hero</th><th>Games</th><th>Win %</th><th>KDA</th></tr></thead><tbody>${p.heroes.map(([id,s])=>`<tr><td><span class="nm"><img class="hi" src="${D.H[id].i}" alt="">${D.H[id].n}</span></td><td>${s[0]}</td><td><div class="hero-bar">${wr(s[1],s[0])}<div class="bar" style="width:70px"><i style="width:${pct(s[1],s[0])}%"></i></div></div></td><td>${((s[2]+s[4])/Math.max(1,s[3])).toFixed(2)}</td></tr>`).join('')}</tbody></table></div>`}
function rel(list,label){return `<div class="deco">${list.map(([id,name,a,n,w])=>`<div class="rel"><img src="${a}" alt=""><div style="min-width:0"><b>${name}</b><br><small>${n} games ${label}</small></div><div class="r">${wr(w,n)}<div class="bar"><i style="width:${pct(w,n)}%;${pct(w,n)<50?'background:var(--loss)':''}"></i></div></div></div>`).join('')}</div>`}

const tp=p.heroes.slice(0,3);const na=`<div class="note deco">Sample data is baked in for Gabe only; in production each profile loads its own mate-stats / enemy-stats.</div>`;
const body={
overview:`<div class="grid g3"><div><div class="sec">Recent Matches</div><div class="deco">${matchRows(p,5)}<div class="note"><a href="#p/${p.id}/matches" style="color:var(--gold2)">All matches →</a></div></div></div><div><div class="sec">Favourite Heroes</div><div class="deco pad" style="display:flex;gap:10px;flex-wrap:wrap">${tp.map(([id,s])=>`<div style="text-align:center;width:90px"><img src="${D.H[id].c}" style="width:90px;height:110px;object-fit:cover;object-position:top;border:1px solid var(--gold)" alt=""><div class="cz" style="font-size:12px">${D.H[id].n}</div><small>${s[0]} g · ${pct(s[1],s[0])}%</small></div>`).join('')}</div><div class="sec">Record</div><div class="deco pad"><div style="display:flex;justify-content:space-between"><span class="w">${p.w} wins</span><span class="l">${p.n-p.w} losses</span></div><div class="bar" style="height:10px;margin:6px 0;background:var(--loss)"><i style="width:${pct(p.w,p.n)}%"></i></div><small style="color:var(--mu)">${p.k} kills · ${p.d} deaths · ${p.a} assists across ${p.n} matches</small></div></div></div>`,
matches:`<div class="sec">Match History</div><div class="deco">${matchRows(p,15)}</div>`,
heroes:`<div class="sec">Hero Breakdown</div>${heroRows(p)}`,
teammates:main?`<div class="sec">Best Played With</div>${rel(D.mates,'together')}`:na,

<div class="tabs">${tabs}</div><div>${body}</div>`}
function match(){const M=D.M,v=$('#v-m');const mine=M.pl.find(x=>x.id==cur.sel)||M.pl.find(x=>x.id==907065245);

const tot=mine.src.reduce((a,b)=>a+b,0);
const team=t=>`<div class="sec" style="color:${t?'var(--sap)':'var(--amber)'}">${t?'Sapphire':'Amber'} ${M.win==t?'· Victory':''}</div><div class="deco tw"><table><thead><tr><th>Player</th><th>K/D/A</th><th>Souls</th><th>Dmg</th><th>Heal</th></tr></thead><tbody>${M.pl.filter(x=>x.t==t).map(x=>`<tr class="pick ${x.id==mine.id?'me':''}" data-id="${x.id}"><td><span class="nm"><img class="hi" src="${D.H[x.h].i}" alt="">${x.name}</span></td><td>${x.k}/${x.d}/${x.a}</td><td>${x.nw.toLocaleString()}</td><td>${x.dmg.toLocaleString()}</td><td>${x.heal.toLocaleString()}</td></tr>`).join('')}</tbody></table></div>`;
v.innerHTML=`<div class="deco mh"><div><h2>Match #${M.id}</h2><small style="color:var(--mu)">${dt(M.t)} · ${mm(M.dur)}</small></div><div class="cz" style="font-size:18px;color:${M.win?'var(--sap)':'var(--amber)'}">${M.win?'Sapphire':'Amber'} wins</div></div>
<div class="sec">${mine.name} — ${D.H[mine.h].n}</div><div class="deco pad"><div class="cz" style="font-size:12px;color:var(--mu)">SOULS BY SOURCE · ${tot.toLocaleString()}</div><div class="srcbar">${mine.src.map((s,i)=>`<i style="width:${s/tot*100}%;background:${col[i]}" title="${lab[i]}: ${s}"></i>`).join('')}</div><div class="leg">${mine.src.map((s,i)=>`<span style="--c:${col[i]}">${lab[i]} ${s.toLocaleString()}</span>`).join('')}</div>

<div class="grid g3">${[0,1].map(t=>`<div>${team(t)}</div>`).join('')}</div><p class="note">Tap a row to inspect that player's souls and build.</p>`;
v.querySelectorAll('tr.pick').forEach(r=>r.onclick=()=>{cur.sel=r.dataset.id;match()})}
function route(){const h=location.hash.slice(1).split('/');const v=h[0]||'home';
if(v=='p'){cur.p=+h[1]||907065245;cur.tab=h[2]||'overview'}
if(v=='matches'){location.hash='#p/907065245/matches';return}
if(v=='m')cur.sel=null;
const key=['home','lb','p','m'].includes(v)?v:'home';
document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id=='v-'+key));
document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v==v||(v=='m'&&a.dataset.v=='matches')||(v=='p'&&cur.tab=='matches'&&a.dataset.v=='matches')||(v=='p'&&cur.tab!='matches'&&a.dataset.v=='p')));
({home,lb,p:prof,m:match})[key]();window.scrollTo(0,0)}
document.querySelectorAll('#nav a').forEach(a=>a.onclick=()=>location.hash='#'+(a.dataset.v=='p'?'p/907065245':a.dataset.v));
