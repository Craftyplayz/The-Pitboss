<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Pitboss — Hero Meta Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0b09;--bg2:#171310;--card:#1d1814;--line:#3a2f24;--tx:#efe4d2;--mut:#a09483;--gold:#d9a441;--win:#6fcf7f;--loss:#e5605a}
*{box-sizing:border-box;margin:0}html{overflow-x:hidden}
body{background:radial-gradient(1200px 500px at 50% -100px,#2b1e12,transparent),var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,sans-serif;overflow-x:hidden;min-height:100vh}
h1,h2,h3,.fz{font-family:Cinzel,Georgia,serif;letter-spacing:.04em}
header{position:sticky;top:0;z-index:20;background:rgba(13,11,9,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding:8px 14px;flex-wrap:wrap}
.logo{font:800 20px Cinzel,serif;color:var(--gold);cursor:pointer;white-space:nowrap}.logo small{display:block;font:400 10px Inter;color:var(--mut);letter-spacing:.15em}
nav{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}nav button{background:none;border:0;color:var(--mut);padding:7px 11px;border-radius:6px;font:600 13px Inter;cursor:pointer;white-space:nowrap}
nav button.on,nav button:hover{background:var(--card);color:var(--gold)}
.strip{display:flex;gap:6px;padding:6px 14px 9px;overflow-x:auto;scrollbar-width:thin}
.strip img{width:46px;height:46px;border-radius:50%;object-fit:cover;object-position:top;border:2px solid var(--c,#555);cursor:pointer;flex:none;background:#000;transition:.15s}
.strip img:hover,.strip img.on{transform:translateY(-3px) scale(1.1);box-shadow:0 0 12px var(--c)}
main{max-width:1180px;margin:0 auto;padding:18px 14px 70px}
.view{display:none}.view.on{display:block}
h2{font-size:22px;color:var(--gold);margin:4px 0 12px}h3{font-size:15px;color:var(--gold);margin:18px 0 8px}
.sub{color:var(--mut);font-size:12px;margin:-8px 0 14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}.tile b{display:block;font:800 22px Cinzel;color:var(--tx)}.tile span{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.tier{display:flex;gap:12px;margin-bottom:14px;align-items:stretch}
.tl{flex:none;width:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font:800 26px Cinzel;color:#111;background:var(--tc);box-shadow:0 0 18px var(--tc)}
.cards{display:flex;flex-wrap:wrap;gap:10px;flex:1;min-width:0}
.hc{position:relative;width:104px;border-radius:10px;overflow:hidden;background:var(--card);border:1px solid var(--tc,var(--line));box-shadow:0 0 14px -2px var(--tc,transparent);cursor:pointer;transition:.15s}
.hc:hover{transform:translateY(-4px) rotate(-1deg);box-shadow:0 0 22px var(--tc,#000)}
.hc img.art{display:block;width:100%;height:128px;object-fit:cover;object-position:top}
.hc .nm{font:600 11px Cinzel;padding:4px 6px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc .st{display:flex;justify-content:space-between;padding:0 6px 5px;font-size:10px;color:var(--mut)}.hc .st b{color:var(--tx)}
.srv{position:absolute;top:4px;right:4px;font:700 10px Inter;padding:2px 5px;border-radius:9px;background:rgba(0,0,0,.8);border:1px solid var(--line)}
.srv.g{color:var(--win)}.srv.b{color:var(--loss)}.srv.n{color:var(--mut)}
.legend{font-size:11px;color:var(--mut);margin:6px 0 14px}
table{width:100%;border-collapse:collapse}th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
th.s{cursor:pointer}th.s:hover,th.on{color:var(--gold)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.pl{display:flex;align-items:center;gap:8px;cursor:pointer}.pl img.av{width:30px;height:30px;border-radius:6px}.pl img.hi{width:26px;height:26px;border-radius:50%;object-fit:cover;object-position:top}
.w{color:var(--win)}.l{color:var(--loss)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.chip{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:5px 11px;cursor:pointer;color:var(--mut);font-size:12px}.chip.on{border-color:var(--gold);color:var(--gold)}
.phead{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;flex-wrap:wrap}
.phead img.av{width:72px;height:72px;border-radius:12px;border:2px solid var(--gold)}.phead h2{margin:0}
.rk{display:flex;align-items:center;gap:8px;margin-left:auto;color:var(--mut);font-size:12px}.rk img{width:44px}
.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pc{position:relative;border-radius:12px;overflow:hidden;background:var(--card);border:1px solid var(--line);cursor:pointer;transition:.15s}.pc:hover{box-shadow:0 0 18px -2px var(--c);border-color:var(--c)}
.pc .art{height:150px;background-size:cover;background-position:top;position:relative}
.pc .art:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,var(--card))}
.pc .wr{position:absolute;right:6px;top:6px;z-index:1;font:800 15px Cinzel;padding:3px 8px;border-radius:8px;background:rgba(0,0,0,.8);border:1px solid var(--wc);color:var(--wc)}
.pc .in{padding:6px 10px 10px}.pc .in b{font:600 14px Cinzel}.pc .in div{color:var(--mut);font-size:12px}
.ml{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--rc);border-radius:10px;padding:8px 12px;margin-bottom:8px;cursor:pointer;flex-wrap:wrap}
.ml.dim{opacity:.8}.ml:hover{background:#241d17}
.ml img{width:48px;height:48px;border-radius:8px;object-fit:cover;object-position:top}.ml .r{font:800 14px Cinzel;color:var(--rc);width:44px}
.ml .k{font-weight:700;min-width:70px}.ml .m{color:var(--mut);font-size:12px;margin-left:auto;text-align:right}
.mh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.team{margin-bottom:16px}.team h3{display:flex;gap:8px;align-items:center}.dot{width:10px;height:10px;border-radius:50%;background:var(--tc);box-shadow:0 0 8px var(--tc)}
.team tr{cursor:pointer}.team tr.on td{background:#2a2118}
.its{display:flex;flex-wrap:wrap;gap:6px}.it{width:46px;height:46px;border-radius:8px;background:#000 center/cover;border:2px solid var(--ic);box-shadow:0 0 8px -2px var(--ic);flex:none}
.its.sm{flex-wrap:nowrap;gap:3px}.its.sm .it{width:24px;height:24px;border-width:1px;border-radius:5px}
.sbar{display:flex;height:26px;border-radius:6px;overflow:hidden;margin:8px 0}.sbar i{display:block}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut)}.leg span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--lc);margin-right:5px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.hero{display:grid;grid-template-columns:260px 1fr;gap:18px;margin-bottom:14px}
.hero .big{border-radius:16px;overflow:hidden;border:2px solid var(--tc);box-shadow:0 0 34px -4px var(--tc);position:relative;background:#000;align-self:start}
.hero .big img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top}
.hero .big em{position:absolute;left:10px;top:10px;font:800 28px Cinzel;font-style:normal;color:#111;background:var(--tc);padding:2px 12px;border-radius:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mini{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--line);cursor:pointer}.mini img{width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:top}.mini b{margin-left:auto}
.irow{display:flex;align-items:center;gap:10px;padding:4px 0}.irow .it{width:34px;height:34px}.irow .t{flex:1;min-width:0}.irow .t small{color:var(--mut)}
#lab{position:fixed;right:8px;bottom:8px;z-index:50;background:#000c;color:var(--gold);border:1px solid var(--gold);padding:4px 9px;border-radius:6px;font:600 11px Inter;pointer-events:none}
@media(max-width:720px){.hero{grid-template-columns:1fr}.hero .big{max-width:240px}.two{grid-template-columns:1fr}.tl{width:34px;font-size:20px}.hc{width:92px}.ml .m{margin-left:0;text-align:left;width:100%}}
</style></head><body>

function go(v){document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==v));

function card(i){const g=G[i],s=SV[i],t=g.t;let b='<span class="srv n">—</span>';
 if(s){const w=pct(s.w,s.n);b=`<span class="srv ${w>=50?'g':'b'}">${s.n}g · ${Math.round(w)}%</span>`}

function rHome(){const tm=Object.values(G).reduce((a,g)=>a+g.n,0)/12,sg=D.players.reduce((a,p)=>a+p.h.reduce((x,r)=>x+r[1],0),0),sw=D.players.reduce((a,p)=>a+p.h.reduce((x,r)=>x+r[2],0),0);

 const ib=x=>D.items[x];
 const tbl=t=>`<div class="team"><h3 style="color:${tc[t]}"><span class="dot" style="--tc:${tc[t]}"></span>${tn[t]} ${m.win==t?'— Victory':'— Defeat'}</h3><div class="tw"><table><tr><th>Player</th><th>K/D/A</th><th>Souls</th><th>LH</th><th>Dmg</th><th>Heal</th><th>Build</th></tr>`+m.p.map((q,i)=>q.t!=t?'':`<tr class="${i==sel?'on':''}" onclick="sel=${i};rMatch()"><td><div class="pl"><img class="hi" src="${H[q.h].s}"><div><b>${q.nm}</b><div class="sub" style="margin:0">${hn(q.h)}</div></div></div></td><td>${q.k}/${q.d}/${q.as}</td><td>${fk(q.nw)}</td><td>${q.lh}</td><td>${fk(q.dm)}</td><td>${fk(q.hl)}</td><td><div class="its sm">${q.it.map(x=>`<div class="it" style="--ic:${SLOT[ib(x).s]||'#555'};background-image:url(${ib(x).i})"></div>`).join('')}</div></td></tr>`).join('')+`</table></div></div>`;
 $('match').innerHTML=`<h2>Match #${m.id}</h2><div class="mh"><div><b class="fz" style="font-size:20px;color:${tc[m.win]}">${tn[m.win]} wins</b><div class="sub" style="margin:0">${mmss(m.dur)} · ${m.p.filter(q=>q.t==0).reduce((a,q)=>a+q.k,0)} – ${m.p.filter(q=>q.t==1).reduce((a,q)=>a+q.k,0)} kills</div></div><div class="its">${m.p.map(q=>`<img src="${H[q.h].s}" style="width:34px;height:34px;border-radius:50%;object-fit:cover;object-position:top;border:2px solid ${tc[q.t]}">`).join('')}</div></div>
 <div class="panel" style="border-color:${tc[p.t]}"><div class="pl" onclick="hero(${p.h})"><img class="hi" style="width:48px;height:48px" src="${H[p.h].s}"><div><h3 style="margin:0">${p.nm} · ${hn(p.h)}</h3><div class="sub" style="margin:0">${p.k}/${p.d}/${p.as} · ${fk(p.nw)} souls (pick a row below)</div></div></div>
 <h3>Souls by source</h3><div class="sbar">${Object.entries(p.src).map(([k,v])=>`<i title="${k} ${v}" style="width:${100*v/tot}%;background:${srcc[k]}"></i>`).join('')}</div><div class="leg">${Object.entries(p.src).map(([k,v])=>`<span style="--lc:${srcc[k]}">${k} ${v.toLocaleString()}</span>`).join('')}</div>
 <h3>Final build</h3><div class="its">${p.it.map(x=>`<div style="text-align:center;width:66px"><div class="it" style="--ic:${SLOT[ib(x).s]||'#555'};background-image:url(${ib(x).i});width:54px;height:54px;margin:auto"></div><small style="font-size:10px;color:var(--mut)">${ib(x).n}</small></div>`).join('')}</div></div>`+tbl(0)+tbl(1)}
function rHero(){const i=hi,g=G[i],t=g.t,c=D.cnt[i]||{bad:[],good:[]},sy=D.syn[i]||[],s=SV[i],tp=D.top[i]||[];
 const mini=a=>a.map(x=>`<div class="mini" onclick="hero(${x[0]})"><img src="${H[x[0]].s}">${hn(x[0])}<b style="color:${wcol(x[1])}">${x[1]}%</b></div>`).join('')||'<div class="sub">No data</div>';
 $('hero').innerHTML=`<div class="hero" style="--tc:${TC[t]}"><div class="big"><img src="${H[i].c}"><em>${t}</em></div><div><h2 style="font-size:32px;margin:0">${hn(i)}</h2><p class="sub" style="margin-top:4px">${t}-tier · #${Object.keys(G).sort((a,b)=>G[b].wr-G[a].wr).indexOf(String(i))+1} of ${Object.keys(G).length} by win rate</p>
 <div class="tiles"><div class="tile"><b style="color:${wcol(g.wr)}">${f1(g.wr)}%</b><span>Global win</span></div><div class="tile"><b>${f1(g.pick)}%</b><span>Pick rate</span></div><div class="tile"><b>${g.kda}</b><span>KDA</span></div><div class="tile"><b>${fk(g.n)}</b><span>Matches</span></div></div>
 <div class="panel"><h3 style="margin-top:0">Who plays this on our server</h3>${s?s.p.sort((a,b)=>b[1][1]-a[1][1]).map(([p,r])=>`<div class="mini" onclick="prof(${D.players.indexOf(p)})"><img src="${p.av}" style="border-radius:6px"><span>${p.name}</span><small style="color:var(--mut)">${r[1]}g</small><b style="color:${wcol(pct(r[2],r[1]))}">${Math.round(pct(r[2],r[1]))}%</b></div>`).join(''):'<div class="sub" style="margin:0">Nobody linked has played this hero yet. Be the first.</div>'}</div></div></div>
 <div class="two"><div class="panel"><h3 style="margin-top:0">Top items (by win rate)</h3>${tp.length?tp.map(([k,w,p])=>{const it=D.items[k];return `<div class="irow"><div class="it" style="--ic:${SLOT[it.s]||'#555'};background-image:url(${it.i})"></div><div class="t">${it.n}<br><small>${it.c||''} souls · pick ${p}% of top</small></div><b style="color:${wcol(w)}">${w}%</b></div>`}).join(''):'<div class="sub" style="margin:0">item-stats timed out for this hero in the sample pull.</div>'}</div>
 <div><div class="panel"><h3 style="margin-top:0">Counters: hardest matchups</h3>${mini(c.bad)}<h3>Favourable matchups</h3>${mini(c.good)}</div><div class="panel"><h3 style="margin-top:0">Best synergies</h3>${mini(sy)}</div></div></div>`}
rHome();rBoard();rProf();rMatches();rMatch();rHero();go('home');
</script></body></html>
